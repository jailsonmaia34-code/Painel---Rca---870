:root[data-theme="dark"]{ --ink:#0f131a; --panel:#1a2029; --panel2:#20272f; --line:#2b3340; --text:#eef1f5; --muted:#8b94a3; }

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}

header{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
.avatar{width:40px;height:40px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--amber);font-weight:700;font-size:16px;flex-shrink:0}
header h1{margin:0;font-size:16px}
header p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.updated{padding:0 18px 12px;color:var(--muted);font-size:11.5px}
main{max-width:760px;margin:0 auto;padding:0 16px 60px}

#gate .box{max-width:420px;margin:10px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;position:relative}
#gate .box::before{content:'';position:absolute;top:0;left:16px;right:16px;height:3px;border-radius:0 0 4px 4px;background:repeating-linear-gradient(90deg,var(--red) 0 8px,transparent 8px 14px)}
#gate h2{font-size:19px;margin:8px 0 4px}
#gate p{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.5}
#gate input{width:100%;font-family:'IBM Plex Mono',monospace;font-size:18px;text-align:center;letter-spacing:2px;padding:13px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin-bottom:10px}
#gate button{width:100%;background:var(--blue);color:#fff;border:1px solid #3a5a94;border-radius:9px;padding:13px;font-weight:700;font-size:14px;cursor:pointer;font-family:'Space Grotesk',sans-serif}
#gate .err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px;text-align:center}
#gate .switch{display:block;text-align:center;color:var(--muted);font-size:12.5px;margin-top:16px;text-decoration:underline;cursor:pointer}

.section-title{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-weight:600;margin:22px 0 10px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

.bigcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.bigcard .t{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}

.note{color:var(--muted);font-size:12px;margin-top:8px}

.indcard .h b{font-size:14px}

.badge.g{background:var(--greenbg);color:var(--green)}
.badge.a{background:var(--goldbg);color:var(--gold)}

.ranklist{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 18px}
.rankrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}

.rankrow .val{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:12.5px}

function meuPin(cod){ try{ return localStorage.getItem('pin_'+cod)||''; }catch(e){ return ''; } }
function salvarMeuPin(cod, v){ try{ localStorage.setItem('pin_'+cod, v); }catch(e){} }

function tryLogin(){
  const v = document.getElementById('codeInput').value.trim();
  const err = document.getElementById('gateErr');
  const pinAdmin = meuPin('admin');
  const adminOk = pinAdmin ? v===pinAdmin : v===ADMIN_CODE;
  if(adminOk){
    try{ sessionStorage.setItem(SESSION_KEY, ADMIN_CODE); }catch(e){}
    boot(ADMIN_CODE);
    return;
  }
  const r = data.find(function(x){
    if(v.length===0) return false;
    const pin = meuPin(x.cod);
    return pin ? v===pin : v===x.cod;
  });
  if(r){
    if(r.bloqueado){ err.textContent = 'Acesso bloqueado. Fale com a supervisão.'; return; }
    try{ sessionStorage.setItem(SESSION_KEY, r.cod); }catch(e){}
    boot(r.cod);
    return;
  }
  err.textContent = 'Código não encontrado. Confira com a supervisão.';
}

function abrirTrocaSenha(){
  const cod = sessionStorage.getItem(SESSION_KEY);
  const isAdmin = cod===ADMIN_CODE;
  const tam = isAdmin ? 3 : 5;
  const box = document.getElementById('senhaBox');
  box.style.display = box.style.display==='none' ? 'block' : 'none';
  box.innerHTML = '<div class="note" style="margin-bottom:6px">Escolha uma senha nova de '+tam+' números. A partir de agora, o código antigo ('+(isAdmin?ADMIN_CODE:cod)+') deixa de funcionar <b>neste aparelho/navegador</b> — só a senha nova entra aqui. Em outro aparelho, o código antigo continua valendo até ser trocado lá também. Se esquecer a senha nova, limpe os dados do site neste navegador para o código antigo voltar a funcionar.</div>'
    + '<input type="text" id="novaSenha" inputmode="numeric" maxlength="'+tam+'" placeholder="'+tam+' números" style="padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-family:\'IBM Plex Mono\',monospace;width:120px">'

}

function confirmarTrocaSenha(isAdmin){
  const cod = sessionStorage.getItem(SESSION_KEY);
  const tam = isAdmin ? 3 : 5;
  const v = document.getElementById('novaSenha').value.trim();
  const msg = document.getElementById('senhaMsg');
  if(!/^[0-9]+$/.test(v) || v.length!==tam){ msg.textContent = 'Digite exatamente '+tam+' números.'; msg.style.color='var(--red)'; return; }
  salvarMeuPin(isAdmin?'admin':cod, v);
  msg.style.color='var(--green)';
  msg.textContent = 'Senha salva neste aparelho! Use '+v+' da próxima vez que entrar por aqui.';
}

function vol(r){ return pillSum({fat:r.faturado, def:r.definido, lib:r.liberado, pv:r.paradoVenc, pl:r.paradoLimite}); }

function stKeys(){ return ['fat','def','lib','pv','pl'].filter(function(k){ return pillSel[k]; }); }

function clientesSel(r){
  var L = r.clientesPositivados || [];
  if(!L.length || !L[0].st) return pillSel.fat ? L : [];
  var ks = stKeys();
  return L.filter(function(c){ return c.st.some(function(k){ return ks.indexOf(k)>=0; }); });
}

function positSel(r){
  var L = r.clientesPositivados || [];
  if(!L.length || !L[0].st) return pillSel.fat ? (r.posit||0) : 0;
  return clientesSel(r).length;
}

function indSel(i){
  var ps = i.ps || {}; var set = {}; var v = 0;
  if(pillSel.fat){ v += (i.tipo==='qtd' ? 0 : (i.realizado||0)); (i.clientes||[]).forEach(function(c){ set[c]=true; }); }
  ['def','lib','pv','pl'].forEach(function(k){
    if(pillSel[k] && ps[k]){ v += ps[k].v; ps[k].c.forEach(function(c){ set[c]=true; }); }
  });
  var cl = Object.keys(set).sort();
  return {realizado: (i.tipo==='qtd' ? cl.length : v), clientes: cl};
}

const PREMIO_INDUSTRIA = 340;
const PCT_FIXO = 0.01;
const PCT_VOL = 0.003;
const PCT_POSIT = 0.008;

function fmtPct(p){ return (p*100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'; }

function atualizarTotaisMetas(){
  var el = document.getElementById('metasTot'); if(!el) return;
  var v=0, p=0, ind={};
  data.forEach(function(r){
    var a=document.getElementById('meta_vol_'+r.cod), b=document.getElementById('meta_pos_'+r.cod);
    v += parseNum(a?a.value:r.metaVolume); p += parseNum(b?b.value:r.metaPosit);
    r.industrias.forEach(function(i,idx){
      var c=document.getElementById('meta_ind_'+r.cod+'_'+idx);
      if(!ind[i.nome]) ind[i.nome]={t:i.tipo,s:0};
      ind[i.nome].s += parseNum(c?c.value:i.meta);
    });
  });
  el.innerHTML = 'Soma dos RCAs: volume R$ '+fmt(v)+' \u00b7 positiva\u00e7\u00e3o '+fmt(p)+' clientes<br>'
    + Object.keys(ind).map(function(n){ return n+': '+(ind[n].t==='qtd'?fmt(ind[n].s)+' clientes':'R$ '+fmt(ind[n].s)); }).join(' \u00b7 ');
}

function pct1(x){ return x.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }

function faltaHTML(real, meta, tipo){
  real = real||0; meta = meta||0;
  if(!(meta>0)) return '';
  const p = pctOf(real, meta);
  const un = function(n){ return tipo==='qtd' ? fmt(n)+' cliente(s)' : 'R$ '+fmt(n); };
  if(real>=meta) return '<div class="note" style="color:var(--green);margin-top:6px">\u2714 Meta batida \u00b7 atingido '+pct1(p)+' \u00b7 '+un(real-meta)+' acima da meta</div>';
  return '<div class="note" style="margin-top:6px">Atingido <b>'+pct1(p)+'</b> ('+un(real)+') \u00b7 Falta <b style="color:var(--red)">'+pct1(100-p)+'</b> ('+un(meta-real)+')</div>';
}

function calcComissao(r){
  const base = r.faturado;
  const volOk = r.metaVolume>0 && base >= r.metaVolume;
  const positOk = r.metaPosit>0 && (r.posit||0) >= r.metaPosit;
  const pctTotal = PCT_FIXO + (volOk?PCT_VOL:0) + (positOk?PCT_POSIT:0);
  const valorPct = base * pctTotal;
  const industriasBatidas = (r.industrias||[]).filter(function(i){ return (i.meta>0) && (i.realizado||0) >= i.meta; });
  const premioIndustrias = industriasBatidas.length * PREMIO_INDUSTRIA;
  return {
    base: base, volOk: volOk, positOk: positOk,
    pctFixo: PCT_FIXO, pctVol: volOk?PCT_VOL:0, pctPosit: positOk?PCT_POSIT:0, pctTotal: pctTotal,
    valorPct: valorPct,
    industriasBatidas: industriasBatidas.map(function(i){return i.nome;}),
    premioIndustrias: premioIndustrias,
    total: valorPct + premioIndustrias
  };
}

function pillSum(tot){
  let s = 0;
  if(pillSel.fat) s += tot.fat;
  if(pillSel.def) s += tot.def;
  if(pillSel.lib) s += tot.lib;
  if(pillSel.pv) s += tot.pv;
  if(pillSel.pl) s += tot.pl;
  return s;
}

function pillLabel(){
  const parts = [];
  if(pillSel.fat) parts.push('Faturado');
  if(pillSel.def) parts.push('Definido');
  if(pillSel.lib) parts.push('Liberado');
  if(pillSel.pv) parts.push('Vencido');
  if(pillSel.pl) parts.push('Limite');
  if(parts.length===0) return 'Nada selecionado';
  if(parts.length===5) return 'Todos';
  return parts.join(' + ');
}

function togglePill(key){
  if(key==='todos'){
    const allOn = pillSel.fat && pillSel.def && pillSel.lib && pillSel.pv && pillSel.pl;
    const v = !allOn;
    pillSel = {fat:v, def:v, lib:v, pv:v, pl:v};
  } else {
    pillSel[key] = !pillSel[key];
  }
  rerender();
}

function parseNum(v){
  if(v===undefined||v===null) return 0;
  if(typeof v==='number') return v;
  var s = String(v).trim().replace(/\./g,'').replace(',', '.');
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function parseSituacao(rows){
  var agg = {};
  var revMap = reverseIndMap();
  rows.forEach(function(row){
    var sit = row['SITUACAO']; var vend = row['VENDEDOR'];
    if(!vend || sit==='TOTAL' || String(vend).indexOf(' - ')<0) return;
    var cod = String(vend).split(' - ')[0].trim();
    if(!agg[cod]) agg[cod] = {definido:0, liberado:0, paradoVenc:0, paradoLimite:0, cliSt:{}, clientInd:{}, ind:{}};
    var valor = parseNum(row['Valor R$']);
    var s = String(sit||'');
    if(s.indexOf('DEFINIDO')>=0) agg[cod].definido += valor;
    else if(s.indexOf('LIBERADO')>=0) agg[cod].liberado += valor;
    else if(s.indexOf('VENCIDO')>=0) agg[cod].paradoVenc += valor;
    else if(s.indexOf('LIMITE')>=0) agg[cod].paradoLimite += valor;
    var k = s.indexOf('DEFINIDO')>=0?'def':(s.indexOf('LIBERADO')>=0?'lib':(s.indexOf('VENCIDO')>=0?'pv':(s.indexOf('LIMITE')>=0?'pl':null)));
    var cli = row['CLIENTE'];
    if(k && cli){
      agg[cod].cliSt[cli] = agg[cod].cliSt[cli] || {};
      agg[cod].cliSt[cli][k] = true;
      var fornRaw = String(row['FORNECEDOR']||'');
      var forn = fornRaw.indexOf(' - ')>=0 ? fornRaw.split(' - ').slice(1).join(' - ').trim() : fornRaw.trim();
      if(revMap[forn]){
        agg[cod].clientInd[cli] = agg[cod].clientInd[cli] || {};
        agg[cod].clientInd[cli][revMap[forn]] = true;
        var ib = agg[cod].ind[revMap[forn]] = agg[cod].ind[revMap[forn]] || {};
        ib[k] = ib[k] || {v:0, c:{}};
        ib[k].v += valor;
        ib[k].c[cli] = true;
      }
    }
  });
  return agg;
}

function reverseIndMap(){
  var m = {};
  Object.keys(IND_MAP).forEach(function(k){ m[IND_MAP[k]] = k; });
  MANA_NAMES.forEach(function(fn){ m[fn] = 'Maná'; });
  return m;
}

function parseVendas(rows){
  var fat = {}, clientesSet = {}, fornClientes = {}, fornValor = {}, clientInd = {};
  var revMap = reverseIndMap();
  rows.forEach(function(row){
    var vend = row['VENDEDOR'];
    if(!vend || String(vend).indexOf(' - ')<0) return;
    var cod = String(vend).split(' - ')[0].trim();
    var venda = parseNum(row['Venda R$']);
    fat[cod] = (fat[cod]||0) + venda;
    clientesSet[cod] = clientesSet[cod] || {};
    clientesSet[cod][row['CLIENTE']] = true;
    var fornRaw = String(row['FORNECEDOR']||'');
    var forn = fornRaw.indexOf(' - ')>=0 ? fornRaw.split(' - ').slice(1).join(' - ').trim() : fornRaw.trim();
    fornClientes[cod] = fornClientes[cod] || {};
    fornClientes[cod][forn] = fornClientes[cod][forn] || {};
    fornClientes[cod][forn][row['CLIENTE']] = true;
    fornValor[cod] = fornValor[cod] || {};
    fornValor[cod][forn] = (fornValor[cod][forn]||0) + venda;
    if(revMap[forn]){
      clientInd[cod] = clientInd[cod] || {};
      clientInd[cod][row['CLIENTE']] = clientInd[cod][row['CLIENTE']] || {};
      clientInd[cod][row['CLIENTE']][revMap[forn]] = true;
    }
  });
  return {fat:fat, clientesSet:clientesSet, fornClientes:fornClientes, fornValor:fornValor, clientInd:clientInd};
}

function nomeCliente(raw){
  var s = String(raw||'').trim();
  var i = s.indexOf(' - ');
  return i>=0 ? s.slice(i+3).trim() : s;
}

function clientesDaIndustria(cod, nome, fornClientes){
  var set = {};
  if(nome==='Maná'){
    MANA_NAMES.forEach(function(fn){
      if(fornClientes[cod] && fornClientes[cod][fn]) Object.keys(fornClientes[cod][fn]).forEach(function(c){ set[c]=true; });
    });
  } else {
    var fn = IND_MAP[nome];
    if(fn && fornClientes[cod] && fornClientes[cod][fn]) Object.keys(fornClientes[cod][fn]).forEach(function(c){ set[c]=true; });
  }
  return Object.keys(set);
}

function clientListHTML(list){
  if(!list || list.length===0) return '<div class="note">Nenhum cliente registrado ainda.</div>';
  return '<ul style="margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--muted);line-height:1.6">'
    + list.map(function(c){
        if(typeof c === 'string') return '<li>'+c+'</li>';
        var tag = (c.industrias && c.industrias.length) ? ' <span style="color:var(--amber)">— '+c.industrias.join(', ')+'</span>' : ' <span style="color:var(--amber)">— fora das indústrias foco</span>';
        return '<li>'+c.nome+tag+'</li>';
      }).join('')
    + '</ul>';
}

function realizadoIndustria(cod, nome, tipo, fornClientes, fornValor){
  var clientes = {}; var valor = 0; var count = 0;
  if(nome==='Maná'){
    MANA_NAMES.forEach(function(fn){
      if(fornClientes[cod] && fornClientes[cod][fn]){
        Object.keys(fornClientes[cod][fn]).forEach(function(c){ if(!clientes[c]){clientes[c]=true; count++;} });
        valor += (fornValor[cod][fn]||0);
      }
    });
  } else {
    var fn = IND_MAP[nome];
    if(fn && fornClientes[cod] && fornClientes[cod][fn]){
      count = Object.keys(fornClientes[cod][fn]).length;
      valor = fornValor[cod][fn]||0;
    }
  }
  return tipo==='qtd' ? count : Math.round(valor*100)/100;
}

function baixarArquivoAtualizado(doc, filename){
  var blob = new Blob([doc], {type:'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename || 'index.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

function mergePositivacao(r, v, s){
  var m = {};
  function get(c){ if(!m[c]) m[c] = {st:{}, inds:{}}; return m[c]; }
  Object.keys(v.clientesSet[r.cod]||{}).forEach(function(c){
    var e = get(c); e.st.fat = true;
    if(v.clientInd[r.cod] && v.clientInd[r.cod][c]) Object.keys(v.clientInd[r.cod][c]).forEach(function(k){ e.inds[k]=true; });
  });
  if(s && s.cliSt) Object.keys(s.cliSt).forEach(function(c){
    var e = get(c);
    Object.keys(s.cliSt[c]).forEach(function(k){ e.st[k]=true; });
    if(s.clientInd && s.clientInd[c]) Object.keys(s.clientInd[c]).forEach(function(k){ e.inds[k]=true; });
  });
  var lista = Object.keys(m);
  r.posit = lista.filter(function(c){ return m[c].st.fat; }).length;
  r.clientesPositivados = lista.map(function(c){
    return {nome: nomeCliente(c), industrias: Object.keys(m[c].inds), st: Object.keys(m[c].st)};
  }).sort(function(a,b){ return a.nome.localeCompare(b.nome); });
}

async function processarArquivos(){
  const msg = document.getElementById('updMsg');
  const f1 = document.getElementById('fileSituacao').files[0];
  const f2 = document.getElementById('fileVendas').files[0];
  if(!f1 || !f2){ msg.textContent='Selecione os dois arquivos.'; msg.className='msg err'; return; }
  msg.textContent='Lendo arquivos...'; msg.className='msg';
  try{
    const buf1 = await f1.arrayBuffer();
    const buf2 = await f2.arrayBuffer();
    const wb1 = XLSX.read(buf1, {type:'array'});
    const wb2 = XLSX.read(buf2, {type:'array'});
    const rows1 = XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]]);
    const rows2 = XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]]);
    const sit = parseSituacao(rows1);
    const v = parseVendas(rows2);
    data.forEach(function(r){
      const s = sit[r.cod] || {definido:0,liberado:0,paradoVenc:0,paradoLimite:0,cliSt:{},clientInd:{},ind:{}};
      r.faturado = Math.round((v.fat[r.cod]||0)*100)/100;
      r.definido = Math.round(s.definido*100)/100;
      r.liberado = Math.round(s.liberado*100)/100;
      r.paradoVenc = Math.round(s.paradoVenc*100)/100;
      r.paradoLimite = Math.round(s.paradoLimite*100)/100;
      mergePositivacao(r, v, s);
      r.industrias.forEach(function(i){
        i.realizado = realizadoIndustria(r.cod, i.nome, i.tipo, v.fornClientes, v.fornValor);
        i.clientes = clientesDaIndustria(r.cod, i.nome, v.fornClientes).map(nomeCliente).sort();
        i.ps = {};
        ['def','lib','pv','pl'].forEach(function(k){
          var b = s.ind && s.ind[i.nome] && s.ind[i.nome][k];
          i.ps[k] = b ? {v: Math.round(b.v*100)/100, c: Object.keys(b.c).map(nomeCliente).sort()} : {v:0, c:[]};
        });
      });
      r.ind = r.industrias.filter(function(i){return i.tipo==='qtd';}).reduce(function(a,i){return a+i.realizado;},0);
    });
    const newUpdated = new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
    const doc = buildDoc(data, newUpdated);
    baixarArquivoAtualizado(doc, 'index.html');
    document.getElementById('updDate').textContent = newUpdated;
    msg.textContent = 'Arquivo index.html atualizado baixado! Agora arraste esse arquivo no Netlify (mesmo site) pra atualizar pra todo mundo. Dados de '+data.length+' RCAs recalculados (comissão só sobre o faturado; os outros valores entram no panorama).';
    msg.className = 'msg ok';
  }catch(e){
    msg.textContent = 'Erro ao processar arquivos ('+(e && e.message ? e.message : 'erro')+').';
    msg.className='msg err';
  }
}

function parseUpdateText(raw){
  const lines = raw.split(/\r?\n/).filter(function(l){ return l.trim(); });
  const byCod = {};
  data.forEach(function(r,i){ byCod[r.cod]=i; });
  let updated=0, skipped=0;
  const num = function(s){ return parseFloat((s||'0').replace(/\./g,'').replace(',','.')) || 0; };
  lines.forEach(function(line){
    const parts = line.split('\t').map(function(s){ return s.trim(); });
    if(parts.length<2) return;
    const cod = parts[0].replace(/\D/g,'');
    const idx = byCod[cod];
    if(idx===undefined){ skipped++; return; }
    data[idx].faturado = num(parts[1]);
    data[idx].definido = num(parts[2]);
    data[idx].liberado = num(parts[3]);
    data[idx].paradoVenc = num(parts[4]);
    data[idx].paradoLimite = num(parts[5]);
    data[idx].posit = num(parts[6]);
    updated++;
  });
  return {updated:updated, skipped:skipped};
}
