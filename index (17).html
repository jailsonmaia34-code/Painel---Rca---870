async function salvarMetas(){
  var msg = document.getElementById('metasMsg');
  try{
    var eqv = document.getElementById('eq_vol'), eqp = document.getElementById('eq_pos');
    if(eqv) META_EQ.volume = parseNum(eqv.value);
    if(eqp) META_EQ.posit = parseNum(eqp.value);
    var nomes = [];
    data.forEach(function(r){ (r.industrias||[]).forEach(function(i){ if(nomes.indexOf(i.nome) < 0) nomes.push(i.nome); }); });
    META_EQ.ind = {};
    nomes.forEach(function(n, idx){
      var el = document.getElementById('eq_ind_'+idx);
      var v = el ? parseNum(el.value) : 0;
      if(v > 0) META_EQ.ind[n] = v;
    });
    data.forEach(function(r){
      var vEl = document.getElementById('meta_vol_'+r.cod), pEl = document.getElementById('meta_pos_'+r.cod);
      if(vEl) r.metaVolume = parseNum(vEl.value);
      if(pEl) r.metaPosit = parseNum(pEl.value);
      var bEl = document.getElementById('bloq_'+r.cod);
      r.bloqueado = bEl ? !!bEl.checked : !!r.bloqueado;
      (r.industrias||[]).forEach(function(i, idx){
        var el = document.getElementById('meta_ind_'+r.cod+'_'+idx);
        if(el) i.meta = parseNum(el.value);
      });
    });
    var now = new Date().toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'});
    baixarArquivoAtualizado(buildDoc(data, now), 'index.html');
    LAST_UPDATE = now;
    document.getElementById('updDate').textContent = now;
    renderTeam();
    var box = document.getElementById('metasBox'); if(box) box.open = true;
    msg = document.getElementById('metasMsg');
    msg.className = 'msg ok';
    msg.textContent = 'Metas salvas. O index.html foi baixado — publique esse arquivo para valer para toda a equipe.';
  }catch(e){
    if(msg){ msg.className = 'msg err'; msg.textContent = 'Erro ao salvar metas ('+(e && e.message ? e.message : 'erro')+').'; }
  }
}

function mergeParcial(r, v, s){
  /* atualiza só a parte enviada (v = vendas, s = situação); mantém a outra como estava */
  var m = {};
  function get(n){ if(!m[n]) m[n] = {st:{}, inds:{}, val:{}}; return m[n]; }
  (r.clientesPositivados||[]).forEach(function(c){
    var e = null;
    (c.st||[]).forEach(function(k){
      var descarta = (k === 'fat') ? !!v : !!s;
      if(!descarta){ e = e || get(c.nome); e.st[k] = true; if(c.val && c.val[k]) e.val[k] = c.val[k]; }
    });
    if(e) (c.industrias||[]).forEach(function(i){ e.inds[i] = true; });
  });
  if(v){
    Object.keys((v.clientesSet && v.clientesSet[r.cod]) || {}).forEach(function(c){
      var e = get(nomeCliente(c)); e.st.fat = true;
      var cv = v.cliVenda && v.cliVenda[r.cod] && v.cliVenda[r.cod][c];
      if(cv) e.val.fat = Math.round(cv*100)/100;
      if(v.clientInd && v.clientInd[r.cod] && v.clientInd[r.cod][c]) Object.keys(v.clientInd[r.cod][c]).forEach(function(k){ e.inds[k] = true; });
    });
  }
  if(s && s.cliSt){
    Object.keys(s.cliSt).forEach(function(c){
      var e = get(nomeCliente(c));
      Object.keys(s.cliSt[c]).forEach(function(k){ e.st[k] = true; });
      if(s.clientInd && s.clientInd[c]) Object.keys(s.clientInd[c]).forEach(function(k){ e.inds[k] = true; });
      if(s.cliVal && s.cliVal[c]) Object.keys(s.cliVal[c]).forEach(function(k){ if(s.cliVal[c][k]) e.val[k] = Math.round(s.cliVal[c][k]*100)/100; });
    });
  }
  var nomes = Object.keys(m);
  r.posit = nomes.filter(function(n){ return m[n].st.fat; }).length;
  r.clientesPositivados = nomes.map(function(n){
    return {nome:n, industrias:Object.keys(m[n].inds), st:Object.keys(m[n].st), val:m[n].val};
  }).sort(function(a,b){ return String(a.nome).localeCompare(String(b.nome)); });
}

async function processarArquivos(modo){
  var msg = document.getElementById('updMsg');
  var f1 = modo === 'ven' ? null : document.getElementById('fileSituacao').files[0];
  var f2 = modo === 'sit' ? null : document.getElementById('fileVendas').files[0];
  if(modo === 'sit' && !f1){ msg.textContent = 'Escolha o relatório de situação (campo 1).'; msg.className = 'msg err'; return; }
  if(modo === 'ven' && !f2){ msg.textContent = 'Escolha o relatório de vendas (campo 2).'; msg.className = 'msg err'; return; }
  if(!f1 && !f2){ msg.textContent = 'Selecione pelo menos um arquivo.'; msg.className = 'msg err'; return; }
  msg.textContent = 'Lendo arquivos...'; msg.className = 'msg';
  try{
    var sit = null, v = null;
    if(f1){
      var wb1 = XLSX.read(await f1.arrayBuffer(), {type:'array'});
      var rows1 = XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]]);
      if(!rows1.some(function(x){ return 'SITUACAO' in x; })) throw new Error('o arquivo do campo 1 não parece o relatório de situação (coluna SITUACAO não encontrada)');
      sit = parseSituacao(rows1);
    }
    if(f2){
      var wb2 = XLSX.read(await f2.arrayBuffer(), {type:'array'});
      var rows2 = XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]]);
      if(!rows2.some(function(x){ return 'Venda R$' in x; })) throw new Error('o arquivo do campo 2 não parece o relatório de vendas (coluna Venda R$ não encontrada)');
      v = parseVendas(rows2);
      cliRegistrarVendas(v);
    }
    var nAuto = cliAutoCarteira([rows1, rows2]);
    FONTES = {sit: !!sit, ven: !!v};
    var temSit = !!sit;
    sit = sit || {};
    v = v || {fat:{}, clientesSet:{}, fornClientes:{}, fornValor:{}, clientInd:{}, cliVenda:{}, fornCliVal:{}};
    var naoEncontrados = 0;
    data.forEach(function(r){
      var s = null;
      if(sit){
        s = sit[r.cod];
        if(!s && temSit) naoEncontrados++;
        s = s || {definido:0, liberado:0, paradoVenc:0, paradoLimite:0, cliSt:{}, cliVal:{}, clientInd:{}, ind:{}};
        r.definido = Math.round(s.definido*100)/100;
        r.liberado = Math.round(s.liberado*100)/100;
        r.paradoVenc = Math.round(s.paradoVenc*100)/100;
        r.paradoLimite = Math.round(s.paradoLimite*100)/100;
      }
      if(v){
        r.faturado = Math.round((v.fat[r.cod]||0)*100)/100;
        r.forn = {};
        Object.keys(v.fornValor[r.cod]||{}).forEach(function(n){
          var val = Math.round(v.fornValor[r.cod][n]*100)/100;
          if(n && val > 0) r.forn[n] = val;
        });
      }
      mergePositivacao(r, v, s);
      (r.industrias||[]).forEach(function(i){
        if(v){
          i.realizado = realizadoIndustria(r.cod, i.nome, i.tipo, v.fornClientes, v.fornValor, i.pmin, v.fornCliVal);
          i.clientes = clientesDaIndustria(r.cod, i.nome, v.fornClientes, i.pmin, v.fornCliVal).map(nomeCliente).sort();
        }
        if(sit){
          i.ps = {};
          ['def','lib','pv','pl'].forEach(function(k){
            var b = s.ind && s.ind[i.nome] && s.ind[i.nome][k];
            i.ps[k] = b ? {v: Math.round(b.v*100)/100, c: Object.keys(b.c).map(nomeCliente).sort()} : {v:0, c:[]};
          });
        }
      });
      if(v) r.ind = (r.industrias||[]).filter(function(i){ return i.tipo === 'qtd'; }).reduce(function(a,i){ return a + (i.realizado||0); }, 0);
    });
    var now = new Date().toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'});
    baixarArquivoAtualizado(buildDoc(data, now), 'index.html');
    LAST_UPDATE = now;
    document.getElementById('updDate').textContent = now;
    renderTeam();
    msg = document.getElementById('updMsg');
    msg.className = 'msg ok';
    var quais = (FONTES.sit && FONTES.ven) ? 'situação e vendas' : (FONTES.sit ? 'só a situação (o faturado saiu do painel; envie o relatório de vendas para voltar)' : 'só as vendas (a situação saiu do painel; envie o relatório de situação para voltar)');
    if(msg){
      msg.textContent = 'Pronto! '+data.length+' RCAs recalculados com '+quais
        + (naoEncontrados ? ' ('+naoEncontrados+' sem linha no relatório de situação, valores zerados)' : '')
        + (nAuto ? ' '+nAuto+' cliente(s) novo(s) entraram na carteira.' : '')
        + '. O index.html foi baixado — publique esse arquivo para atualizar a equipe.';
    }
  }catch(e){
    msg.textContent = 'Erro ao processar arquivos ('+(e && e.message ? e.message : 'erro')+').';
    msg.className = 'msg err';
  }
}

function parseUpdateText(raw){
  var lines = String(raw||'').split(/\r?\n/).filter(function(l){ return l.trim(); });
  var byCod = {};
  data.forEach(function(r, i){ byCod[r.cod] = i; });
  var updated = 0, skipped = 0;
  var num = function(s){ return parseNum(s); };
  lines.forEach(function(line){
    var parts = line.split('\t').map(function(s){ return s.trim(); });
    if(parts.length < 2) return;
    var cod = parts[0].replace(/\D/g,'');
    var idx = byCod[cod];
    if(idx === undefined){ skipped++; return; }
    var r = data[idx];
    if(parts[1] !== undefined && parts[1] !== '') r.faturado = num(parts[1]);
    if(parts[2] !== undefined && parts[2] !== '') r.definido = num(parts[2]);
    if(parts[3] !== undefined && parts[3] !== '') r.liberado = num(parts[3]);
    if(parts[4] !== undefined && parts[4] !== '') r.paradoVenc = num(parts[4]);
    if(parts[5] !== undefined && parts[5] !== '') r.paradoLimite = num(parts[5]);
    if(parts[6] !== undefined && parts[6] !== '') r.posit = num(parts[6]);
    updated++;
  });
  return {updated:updated, skipped:skipped};
}

async function salvarEPublicar(){
  var msg = document.getElementById('updMsg');
  var raw = document.getElementById('updTextarea').value.trim();
  if(!raw){ msg.textContent = 'Cole os dados antes de salvar.'; msg.className = 'msg err'; return; }
  try{
    var r = parseUpdateText(raw);
    var now = new Date().toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'});
    baixarArquivoAtualizado(buildDoc(data, now), 'index.html');
    LAST_UPDATE = now;
    document.getElementById('updDate').textContent = now;
    document.getElementById('updTextarea').value = '';
    renderTeam();
    msg = document.getElementById('updMsg');
    msg.className = 'msg ok';
    msg.textContent = 'Pronto! '+r.updated+' RCA(s) atualizada(s)'
      + (r.skipped ? ', '+r.skipped+' código(s) não encontrado(s)' : '')
      + '. O index.html foi baixado — publique esse arquivo para atualizar a equipe.';
  }catch(e){
    msg.textContent = 'Não foi possível gerar o arquivo ('+(e && e.message ? e.message : 'erro')+').';
    msg.className = 'msg err';
  }
}
