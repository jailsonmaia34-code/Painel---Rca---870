<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel RCA — Equipe 870 (supervisão)</title>
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0b0f16; --bg2:#0f1623; --panel:#141b26; --panel2:#1b2431; --panel3:#232e3d;
  --line:#26313f; --line2:#3a4859;
  --text:#edf1f7; --muted:#97a3b4; --muted2:#6d7a8c;
  --amber:#f0b03f; --green:#3ecf9b; --red:#f0736b; --blue:#4d8ef7; --violet:#a98bfa;
  --greenbg:rgba(62,207,155,.13); --redbg:rgba(240,115,107,.13);
  --amberbg:rgba(240,176,63,.13); --bluebg:rgba(77,142,247,.13);
  --sh:0 12px 28px rgba(0,0,0,.34);
  --r:16px; --r2:12px;
  --sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}
:root[data-theme="light"]{
  --bg:#c9d1de; --bg2:#d8dfea; --panel:#dfe5ee; --panel2:#d1d9e5; --panel3:#c3ccdb;
  --line:#b3bdce; --line2:#9aa7bc;
  --text:#131922; --muted:#5b6678; --muted2:#8b95a6;
  --amber:#b7791f; --green:#0f9d72; --red:#dc4a41; --blue:#2d6fd6; --violet:#7c5cf0;
  --greenbg:rgba(15,157,114,.10); --redbg:rgba(220,74,65,.10);
  --amberbg:rgba(183,121,31,.12); --bluebg:rgba(45,111,214,.10);
  --sh:0 8px 22px rgba(16,24,40,.08);
}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100%;
  background-image:radial-gradient(900px 420px at 12% -8%,rgba(77,142,247,.12),transparent 60%),radial-gradient(700px 380px at 92% -12%,rgba(240,176,63,.10),transparent 60%);
  background-repeat:no-repeat}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:11.5px}
.ok{color:var(--green)} .neg{color:var(--red)} .warn{color:var(--amber)}
.strong{font-weight:700}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* ---------- topo ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;
  background:var(--bg);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(160deg,var(--panel3),var(--panel));border:1px solid var(--line2);
  color:var(--amber);font-weight:700;font-size:15px;letter-spacing:.02em}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:16px;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtns{display:flex;gap:6px;flex:0 0 auto}
.updline{padding:9px 18px 0;color:var(--muted);font-size:11.5px}
main{max-width:900px;margin:0 auto;padding:12px 16px calc(60px + env(safe-area-inset-bottom,0px))}

/* ---------- login ---------- */
#gate{max-width:430px;margin:18px auto 0}
.gate-box{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--sh);overflow:hidden}
.gate-strip{position:absolute;top:0;left:0;right:0;height:4px;
  background:repeating-linear-gradient(90deg,var(--red) 0 10px,transparent 10px 18px)}
#gate h2{font-size:20px;margin:10px 0 6px;letter-spacing:-.01em}
#gate p{color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.55}
#gate input{width:100%;font-family:var(--mono);font-size:20px;text-align:center;letter-spacing:.28em;
  padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin-bottom:10px}
#gate input::placeholder{letter-spacing:.06em;font-size:15px;font-family:var(--sans)}
#gate .switch{display:block;text-align:center;color:var(--muted);font-size:12.5px;margin-top:16px;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer}
#gate .err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px;text-align:center}
#senhaBox .gate-box{margin-top:12px}

/* ---------- botões ---------- */
.btn{background:linear-gradient(180deg,#4a86e8,#2f63bd);color:#fff;border:1px solid #558ee9;border-radius:12px;
  padding:12px 16px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:var(--sans)}
.btn:active{transform:translateY(1px)}
.btn.wide{width:100%}
.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ghost:hover{border-color:var(--line2)}
.ghost.icon{padding:8px 10px;font-size:14px;line-height:1}
.backlink{background:none;border:0;color:var(--muted);font-size:12.5px;text-decoration:underline;
  text-underline-offset:3px;cursor:pointer;padding:0;margin:2px 0 8px;font-family:var(--sans);display:inline-block}
.msg{font-size:12px;margin-left:4px}
.msg.ok{color:var(--green)} .msg.err{color:var(--red)}

/* ---------- títulos ---------- */
.ptitle{font-size:22px;margin:2px 0 2px;letter-spacing:-.02em}
.psub{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.sec{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2);
  font-weight:700;margin:22px 0 10px}

/* ---------- cartões ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.card.okcard{border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.card-h b{font-size:14px}
.note{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.55}
.note b{color:var(--text)}
.note.ok{color:var(--green)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:12px}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin:14px 0}
.kpi{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);
  padding:13px 14px 13px 17px;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:var(--line2)}
.kpi.k-ok::before{background:var(--green)} .kpi.k-warn::before{background:var(--amber)} .kpi.k-bad::before{background:var(--red)}
.k-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.k-val{font-size:21px;font-weight:700;margin-top:6px;line-height:1.15;letter-spacing:-.01em}
.k-val small{font-size:12.5px;color:var(--muted);font-weight:600}
.k-sub{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}

/* ---------- anel de progresso ---------- */
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:6px}
.hero-info{flex:1;min-width:210px}
.ringwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.ring{--p:0;--c:var(--green);position:relative;width:118px;height:118px;border-radius:50%;
  display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--panel3) 0)}
.ring::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line)}
.ringin{width:86px;height:86px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center;padding:6px}
.ringin b{font-size:18px;font-family:var(--mono);letter-spacing:-.02em}
.ringfoot{font-size:11.5px;color:var(--muted);text-align:center;max-width:190px;line-height:1.45}
.bar{height:7px;background:var(--panel3);border-radius:99px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .45s ease}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}

/* ---------- pílulas / chips / badges ---------- */
.pills{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.pill{--c:var(--green);display:inline-flex;align-items:center;gap:7px;background:var(--panel);
  border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;padding:8px 12px;
  border-radius:99px;cursor:pointer;font-family:var(--sans)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.45;flex:0 0 auto}
.pill:hover{border-color:var(--line2)}
.pill.on{color:var(--text);border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--panel))}
.pill.on .dot{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.pill b{font-family:var(--mono);font-weight:600;font-size:11.5px;color:var(--text)}
.pill:not(.on) b{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{--c:var(--line2);display:inline-flex;align-items:center;gap:6px;background:var(--panel2);
  border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:11.5px;color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip i.mut{background:var(--muted2)}
.chip b{font-family:var(--mono);color:var(--text)}
.badge{font-size:10px;font-weight:700;letter-spacing:.05em;padding:3px 9px;border-radius:99px;white-space:nowrap;
  background:var(--panel2);color:var(--muted)}
.badge.g{background:var(--greenbg);color:var(--green)}
.badge.a{background:var(--amberbg);color:var(--amber)}
.badge.r{background:var(--redbg);color:var(--red)}
.badge.b{background:var(--bluebg);color:var(--blue)}
.legend{display:flex;flex-direction:column;gap:5px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.legend .lg{display:flex;align-items:center;gap:7px}
.legend .lg i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

/* ---------- indústrias ---------- */
.ind-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ind-h b{font-size:13px;letter-spacing:.01em}
.ind-v{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:8px;flex-wrap:wrap}
.ind-v .strong{font-size:18px;font-family:var(--mono)}
.ind-v .pc{font-family:var(--mono);font-size:12.5px;font-weight:600}
.irow{display:grid;grid-template-columns:1fr minmax(70px,120px) 52px;gap:10px;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.irow:last-child{border-bottom:0}
.irow .bar{margin-top:0}
.irow .mono{text-align:right}

/* ---------- tabela ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--sh)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:660px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  padding:12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none;font-weight:700}
.tbl th.num{text-align:right}
.tbl th[data-act]{cursor:pointer}
.tbl th[data-act]:hover{color:var(--text)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--panel2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.rowbad td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.tbl td.num{text-align:right;font-family:var(--mono);white-space:nowrap}
.pctcell{display:flex;align-items:center;gap:9px;min-width:130px}
.pctcell span{font-family:var(--mono);font-size:12px;white-space:nowrap}
.pctcell .bar{flex:1;margin-top:0}
.rowtools{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}

/* ---------- listas ---------- */
.alist{margin-top:6px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
.arow:last-child{border-bottom:0}
.arow:hover{color:var(--amber)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toolbar input{flex:1;min-width:170px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);font-family:var(--sans);font-size:13px}
.toolbar input::placeholder{color:var(--muted2)}
.clist{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px}
.clist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.clist li:last-child{border-bottom:0}
.cname{min-width:0;overflow-wrap:anywhere}
.ctags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto}
.tag{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--panel3);color:var(--muted);white-space:nowrap}
.tag.warn{background:var(--amberbg);color:var(--amber)}
.tag.st{background:transparent;border:1px solid var(--line2)}

/* ---------- abas ---------- */
.seg{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);padding:5px;border-radius:15px;margin:14px 0 14px}
.seg button{flex:1;padding:10px;border:0;background:transparent;color:var(--muted);font-family:var(--sans);
  font-weight:700;font-size:12.5px;border-radius:11px;cursor:pointer}
.seg button.on{background:var(--panel3);color:var(--text)}
.seg{overflow-x:auto}
.seg button{white-space:nowrap;padding-left:12px;padding-right:12px}
.mcell{line-height:1.25}.mcell small{display:block;color:var(--muted);font-size:10.5px}
.okc{color:var(--green);font-weight:700}
.ck{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.ck b{display:block;font-size:20px;font-family:var(--mono)}.ck span{font-size:11px;color:var(--muted)}
.mi{width:100%;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-family:var(--mono);font-size:12.5px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin:10px 0}
.field select,.field textarea{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-family:var(--sans);font-size:14px}

/* ---------- comissão ---------- */
.crow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.crow:last-child{border-bottom:0}
.crow.off{opacity:.55}
.crow .cico{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:11px;
  background:var(--greenbg);color:var(--green);flex:0 0 auto}
.crow.off .cico{background:var(--redbg);color:var(--red)}
.crow .clbl{flex:1}
.crow b{font-family:var(--mono)}

/* ---------- acordeões / formulários ---------- */
details.acc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;margin-bottom:12px}
details.acc>summary{cursor:pointer;font-weight:700;font-size:13.5px;list-style:none;display:flex;align-items:center;gap:9px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::before{content:'▸';color:var(--muted);font-size:12px;transition:transform .2s}
details.acc[open]>summary::before{transform:rotate(90deg)}
details.mini{border:1px solid var(--line);border-radius:var(--r2);Padding:10px 12px;margin-top:10px;background:var(--panel2)}
details.mini>summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
details.mini>summary::-webkit-details-marker{display:none}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);margin-top:10px}
.field input{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
  color:var(--text);font-family:var(--mono);font-size:13px;width:100%}
.filein{margin-top:6px;width:100%;color:var(--muted);font-size:12px}
textarea.upd{width:100%;min-height:96px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-family:var(--mono);font-size:12px;padding:10px;margin-top:8px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;flex-direction:row}
.chk input{width:auto}
footer{color:var(--muted2);font-size:11px;text-align:center;padding:16px 10px 34px;line-height:1.6}

@media (max-width:520px){
  main{padding:12px 12px calc(56px + env(safe-area-inset-bottom,0px))}
  .brand h1{font-size:15px}
  .ring{width:104px;height:104px}.ringin{width:76px;height:76px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
}
@media print{
  .topbar,.pills,.seg,.rowtools,.toolbar,.noprint,.backlink,.legend,footer{display:none!important}
  body{background:#fff;color:#000;background-image:none}
  :root{--panel:#fff;--panel2:#fff;--panel3:#eee;--line:#ccc;--line2:#bbb;--text:#000;--muted:#555;--muted2:#666;--sh:none}
  main{max-width:none;padding:0}
  .card,.kpi,.tblwrap,details.acc{break-inside:avoid;box-shadow:none}
  details.acc{display:none}
}
</style></head>

/* ------------------------------- utilidades ------------------------------- */
function safeJSON(v){ var t = '</' + 'script'; return JSON.stringify(v).split(t).join('<\\/script'); }

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return c==='&' ? '&amp;' : c==='<' ? '&lt;' : c==='>' ? '&gt;' : c==='"' ? '&quot;' : '&#39;';
  });
}

function nf(n, d){
  n = Number(n);
  if(!isFinite(n)) n = 0;
  return n.toLocaleString('pt-BR', {minimumFractionDigits:d||0, maximumFractionDigits:d||0});
}
function fmt(n){ return nf(n, 0); }
function money(n){ return 'R$ ' + nf(n, 0); }
function money2(n){ return 'R$ ' + nf(n, 2); }
function fmtPct(p){ return nf(p*100, 2) + '%'; }
function pct1(x){ return nf(x, 2) + '%'; }
function pctOf(real, meta){ real = Number(real)||0; meta = Number(meta)||0; return meta > 0 ? (real/meta*100) : 0; }
function barColor(p){ return p >= 100 ? 'var(--green)' : (p >= 70 ? 'var(--amber)' : 'var(--red)'); }
function tone(p){ return p >= 100 ? 'ok' : (p >= 70 ? 'warn' : 'bad'); }
function qtd(n){ return fmt(n) + ' cliente' + (Math.abs(Number(n))===1 ? '' : 's'); }
function unid(v, tipo){ return tipo === 'qtd' ? qtd(v) : money2(v); }

function parseNum(v){
  if(v===undefined || v===null) return 0;
  if(typeof v === 'number') return v;
  var s = String(v).trim().replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',', '.');
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function refMonth(){
  var m = String(LAST_UPDATE||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(!m) return '';
  var mo = parseInt(m[2],10) - 1;
  if(!(mo >= 0 && mo <= 11)) return '';
  var nome = MESES[mo];
  return nome.charAt(0).toUpperCase() + nome.slice(1) + ' de ' + m[3];
}

function nomeCliente(raw){
  var s = String(raw||'').trim();
  var i = s.indexOf(' - ');
  return i >= 0 ? s.slice(i+3).trim() : s;
}

function reverseIndMap(){
  var m = {};
  Object.keys(IND_MAP).forEach(function(k){ m[IND_MAP[k]] = k; });
  MANA_NAMES.forEach(function(fn){ m[fn] = 'Maná'; });
  return m;
}

  }
  cliQuery = '';

}

function clientesSel(r){

function indSel(i){

    if(i.tipo !== 'qtd') v += (i.realizado||0);
    (i.clientes||[]).forEach(function(c){ set[c] = true; });
  }
  ['def','lib','pv','pl'].forEach(function(k){
    if(pillSel[k] && ps[k]){ v += (ps[k].v||0); (ps[k].c||[]).forEach(function(c){ set[c] = true; }); }
  });

}

  });

function statusCounts(rs){

function hashPin(v){
  var t = 'p870|' + String(v), h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(var i = 0; i < t.length; i++){ var ch = t.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1>>>0)).toString(36);
}
/* a senha gravada no arquivo (PINS) manda; sem ela vale a salva no aparelho; sem nenhuma, vale o código padrão */
function pinCheck(cod, v){
  v = String(v);
  if(PINS && PINS[cod]) return hashPin(v) === PINS[cod];
  var loc = meuPin(cod);
  if(loc) return v === loc;
  return cod === 'admin' ? v === ADMIN_CODE : v === String(cod);
}

function tryLogin(){
  var v = document.getElementById('codeInput').value.trim();
  var err = document.getElementById('gateErr');
  err.textContent = '';
  if(!v){ err.textContent = 'Digite o seu código.'; return; }
  if(pinCheck('admin', v)){
    try{ sessionStorage.setItem(SESSION_KEY, ADMIN_CODE); }catch(e){}
    boot(ADMIN_CODE);
    return;
  }
  var r = data.find(function(x){ return pinCheck(x.cod, v); });
  if(r){
    if(r.bloqueado){ err.textContent = 'Acesso bloqueado. Fale com a supervisão.'; return; }
    try{ sessionStorage.setItem(SESSION_KEY, r.cod); }catch(e){}
    boot(r.cod);
    return;
  }
  err.textContent = 'Código não encontrado. Confira com a supervisão.';
}

function senhaEmUso(v, exceto){
  v = String(v);
  if(exceto !== 'admin' && pinCheck('admin', v)) return true;
  return data.some(function(x){ return x.cod !== exceto && pinCheck(x.cod, v); });
}

function salvarSenhasRCA(){
  var msg = document.getElementById('senhasMsg');
  var novos = {}, resets = {}, ruim = null;
  data.forEach(function(r){
    var el = document.getElementById('pin_'+r.cod), rs = document.getElementById('rst_'+r.cod);
    var v = el ? el.value.trim() : '';
    if(rs && rs.checked) resets[r.cod] = true;
    if(v){
      if(!/^[0-9]{4,8}$/.test(v)){ ruim = r.nome+': use de 4 a 8 números.'; return; }
      novos[r.cod] = v;
    }
  });
  if(ruim){ msg.textContent = ruim; msg.className = 'msg err'; return; }
  var usados = {};
  var cods = Object.keys(novos);
  for(var k = 0; k < cods.length; k++){
    var c = cods[k], v = novos[c];
    if(usados[v]){ msg.textContent = 'A mesma senha foi digitada para dois RCAs.'; msg.className = 'msg err'; return; }
    usados[v] = true;
    if(pinCheck('admin', v)){ msg.textContent = 'Uma das senhas é igual à da supervisão.'; msg.className = 'msg err'; return; }
    var outro = data.find(function(x){
      if(x.cod === c) return false;
      if(novos[x.cod]) return false;
      if(resets[x.cod]) return v === String(x.cod);
      return pinCheck(x.cod, v);
    });
    if(outro){ msg.textContent = 'A senha de '+c+' já é usada por '+outro.nome+'.'; msg.className = 'msg err'; return; }
  }
  if(!cods.length && !Object.keys(resets).length){ msg.textContent = 'Nada para salvar.'; msg.className = 'msg err'; return; }
  cods.forEach(function(c){ PINS[c] = hashPin(novos[c]); try{ localStorage.removeItem('pin_'+c); }catch(e){} });
  Object.keys(resets).forEach(function(c){ if(!novos[c]){ delete PINS[c]; try{ localStorage.removeItem('pin_'+c); }catch(e){} } });
  try{
    baixarArquivoAtualizado(buildDoc(data, LAST_UPDATE || new Date().toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'})), 'index.html');
    renderTeam();
    msg = document.getElementById('senhasMsg');
    msg.className = 'msg ok';
    msg.textContent = 'Pronto! O index.html foi baixado — publique esse arquivo para as senhas valerem para todos.';
  }catch(e){
    msg.textContent = 'Não foi possível gerar o arquivo ('+(e && e.message ? e.message : 'erro')+').'; msg.className = 'msg err';
  }
}

/* ------------------------------- comissão -------------------------------- */
function calcComissao(r){
  var base = Number(r.faturado)||0;
  var volOk = (r.metaVolume > 0) && (base >= r.metaVolume);
  var positOk = (r.metaPosit > 0) && ((r.posit||0) >= r.metaPosit);
  var pctTotal = PCT_FIXO + (volOk ? PCT_VOL : 0) + (positOk ? PCT_POSIT : 0);
  var valorPct = base * pctTotal;
  var industriasBatidas = (r.industrias||[]).filter(function(i){ return (i.meta > 0) && ((i.realizado||0) >= i.meta); });
  return {
    base: base, volOk: volOk, positOk: positOk,
    pctFixo: PCT_FIXO, pctVol: volOk ? PCT_VOL : 0, pctPosit: positOk ? PCT_POSIT : 0, pctTotal: pctTotal,
    valorPct: valorPct,
    industriasBatidas: industriasBatidas.map(function(i){ return i.nome; }),
    premioIndustrias: premioSoma(industriasBatidas),
    total: valorPct + premioSoma(industriasBatidas),
    gapVol: Math.max(0, (r.metaVolume||0) - base),
    gapPosit: Math.max(0, (r.metaPosit||0) - (r.posit||0))
  };
}

  var top = arr.slice(0, 10), max = top[0].v;
  var topSoma = top.reduce(function(a,x){ return a + x.v; }, 0);

/* --------------------- metas por dia e por semana ------------------------ */
function diasUteisAuto(){
  var h = new Date(), fim = new Date(h.getFullYear(), h.getMonth()+1, 0), n = 0;
  for(var d = new Date(h.getFullYear(), h.getMonth(), h.getDate()); d <= fim; d.setDate(d.getDate()+1)){
    var w = d.getDay(); if(w >= 1 && w <= 5) n++;
  }
  return n;
}
function diasUteisMes(){
  var h = new Date(), fim = new Date(h.getFullYear(), h.getMonth()+1, 0), n = 0;
  for(var d = new Date(h.getFullYear(), h.getMonth(), 1); d <= fim; d.setDate(d.getDate()+1)){
    var w = d.getDay(); if(w >= 1 && w <= 5) n++;
  }
  return n;
}
function diasRest(){ return diasOverride > 0 ? diasOverride : Math.max(diasUteisAuto(), 1); }
function setDias(v){ var n = parseInt(v, 10); diasOverride = n > 0 ? n : null; rerender(); }

/* uma meta: cheia (meta do mês ÷ dias úteis do mês) x ajustada (o que falta ÷ dias que restam) */
function mkMeta(meta, real){
  meta = Number(meta)||0; real = Number(real)||0;
  var d = diasRest(), ds = Math.min(5, d), total = Math.max(diasUteisMes(), d), dec = Math.max(total - d, 0);
  var gap = Math.max(meta - real, 0), cheia = meta / total;
  return {meta:meta, real:real, gap:gap, ok:(meta > 0 && gap <= 0), cheia:cheia, cheiaSem:cheia*5,
          hoje:gap/d, sem:gap/d*ds, dec:dec, saldo:real - cheia*dec};
}
function metasRCA(r){
  return {
    vol: mkMeta(r.metaVolume, r.faturado),
    pos: mkMeta(r.metaPosit, r.posit),
    inds: (r.industrias||[]).map(function(i){ var m = mkMeta(i.meta, i.realizado); m.nome = i.nome; m.tipo = i.tipo; return m; })
  };
}
function metasEquipe(){
  var vol = 0, pos = 0, sv = 0, sp = 0, ind = {}, ordem = [];
  data.forEach(function(r){
    vol += Number(r.faturado)||0; pos += Number(r.posit)||0; sv += Number(r.metaVolume)||0; sp += Number(r.metaPosit)||0;
    (r.industrias||[]).forEach(function(i){
      if(!ind[i.nome]){ ind[i.nome] = {nome:i.nome, tipo:i.tipo, meta:0, real:0}; ordem.push(i.nome); }
      ind[i.nome].meta += Number(i.meta)||0; ind[i.nome].real += Number(i.realizado)||0;
    });
  });
  var eq = (typeof META_EQ !== 'undefined' && META_EQ) ? META_EQ : {};
  return {
    vol: mkMeta(eq.volume > 0 ? eq.volume : sv, vol),
    pos: mkMeta(eq.posit > 0 ? eq.posit : sp, pos),
    inds: ordem.map(function(n){
      var m = mkMeta((eq.ind && eq.ind[n] > 0) ? eq.ind[n] : ind[n].meta, ind[n].real); m.nome = n; m.tipo = ind[n].tipo; return m;
    })
  };
}
function mDia(v, tipo){ return tipo === 'qtd' ? nf(v, 1) + ' cl.' : money(v); }
function mSem(v, tipo){ return tipo === 'qtd' ? Math.ceil(v - 1e-9) + ' cl.' : money(v); }

function diasBoxHTML(){
  var d = diasRest(), ds = Math.min(5, d), total = Math.max(diasUteisMes(), d);
  return '<div class="card"><div class="card-h"><b>Prazo do cálculo</b><span class="badge b">'+d+' de '+total+' dias úteis restantes</span></div>'
    + '<div class="note"><b>Meta cheia</b> = meta do mês ÷ '+total+' dias úteis (fixa). <b>Meta de hoje</b> = o que ainda falta ÷ '+d+' dia(s) restante(s): cai quando você bate acima do ritmo e sobe quando fica abaixo. Atualize os relatórios todo dia para ela se reajustar. Conta segunda a sexta; a semana vale '+ds+' dia(s).</div>'
    + '<label class="field noprint" style="margin-top:8px">Ajustar dias úteis restantes (feriado, folga…)'
    + '<input type="text" inputmode="numeric" value="'+(diasOverride>0?diasOverride:'')+'" placeholder="automático: '+diasUteisAuto()+'" onchange="setDias(this.value)"></label></div>';
}

/* seta comparando a meta de hoje com a cheia */
function varHTML(m, tipo){
  if(m.ok || m.cheia <= 0) return '';
  var dif = m.hoje - m.cheia;
  if(Math.abs(dif) < (tipo === 'qtd' ? 0.05 : 1)) return ' <span class="muted small">= cheia</span>';
  return dif > 0 ? ' <span class="neg small">▲ acima da cheia</span>' : ' <span class="okc small">▼ abaixo da cheia</span>';
}
function saldoHTML(m, tipo){
  if(m.dec <= 0 || m.cheia <= 0) return '';
  var v = m.saldo, f = function(x){ return tipo === 'qtd' ? qtd(Math.round(Math.abs(x))) : money(Math.abs(x)); };
  return '<div class="note">Ritmo até ontem: '+(v >= 0 ? '<span class="okc">adiantado '+f(v)+'</span>' : '<span class="neg">atrasado '+f(v)+'</span>')+'</div>';
}
function metaCardHTML(titulo, tipo, m){
  return '<div class="card"><div class="card-h"><b>'+titulo+'</b></div>'
    + '<div class="ind-v"><span class="strong">'+unid(m.real,tipo)+'</span><span class="muted small">meta '+unid(m.meta,tipo)+'</span></div>'
    + (m.ok ? '<div class="note okc">Meta batida ✓</div>'
      : '<div class="note">Falta <b>'+unid(m.gap,tipo)+'</b></div>'
        + '<div class="note">Meta cheia por dia: <b>'+mDia(m.cheia,tipo)+'</b> · por semana: '+mSem(m.cheiaSem,tipo)+'</div>'
        + '<div class="note strong">Meta de hoje: '+mDia(m.hoje,tipo)+varHTML(m,tipo)+'</div>'
        + '<div class="note strong">Por semana (ajustada): '+mSem(m.sem,tipo)+'</div>')
    + saldoHTML(m, tipo) + '</div>';
}

/* ------------------------- clientes e atendimentos ------------------------ */
function cliLoad(){
  try{ var d = JSON.parse(localStorage.getItem(CLI_KEY) || 'null'); if(d && d.clientes) return {clientes:d.clientes, visitas:d.visitas||[], vendas:d.vendas||{}}; }catch(e){}
  return {clientes:{}, visitas:[], vendas:{}};
}
function cliSave(){
  try{ localStorage.setItem(CLI_KEY, JSON.stringify(CLI)); return true; }
  catch(e){ alert('Não foi possível salvar os dados neste navegador. Baixe um backup agora.'); return false; }
}
function cliMesPadrao(){
  var d = new Date(); if(d.getDate() <= 3) d = new Date(d.getFullYear(), d.getMonth()-1, 1);
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
}
function cliHoje(){ var d = new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function cliMesAtual(){ return cliMes || cliHoje().slice(0,7); }
function cliNorm(x){ return String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim(); }
function cliCodigo(raw){ var m = String(raw||'').trim().match(/^(\d+)\s*-/); return m ? m[1] : null; }
function cliRcaNome(cod){ var r = data.find(function(x){ return x.cod === String(cod); }); return r ? r.nome : (cod || '—'); }
function cliSituacao(c, mes){
  var v = (CLI.vendas[mes] || {})[c.cod];
  if(v && v.valor > 0) return 'comprou';
  if(CLI.visitas.some(function(x){ return x.cod === c.cod && String(x.data).slice(0,7) === mes; })) return 'sem';
  return 'nao';
}
var CLI_SIT = {comprou:['Comprou','g'], sem:['Atendido sem compra','a'], nao:['Não atendido','r']};
function cliDownload(txt, nome, tipo){
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type:tipo}));
  a.download = nome; document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function cliRegistrarVendas(v){
  var el = document.getElementById('refMesIn');
  var mes = (el && /^\d{4}-\d{2}$/.test(el.value)) ? el.value : cliHoje().slice(0,7), m = {};
  Object.keys(v.cliVenda || {}).forEach(function(rc){
    Object.keys(v.cliVenda[rc]).forEach(function(raw){
      var c = cliCodigo(raw); if(!c) return;
      if(!m[c]) m[c] = {valor:0, rca:rc};
      m[c].valor += Number(v.cliVenda[rc][raw]) || 0;
    });
  });
  CLI.vendas[mes] = m; cliMes = mes; cliSave();
}
function cliAutoCarteira(listas){
  var novos = 0;
  listas.forEach(function(rows){
    (rows || []).forEach(function(row){
      var vend = String(row['VENDEDOR'] || ''), cli = row['CLIENTE'];
      var rc = cliCodigo(vend), cod = cliCodigo(cli);
      if(!rc || !cod || !data.some(function(x){ return x.cod === rc; })) return;
      var ex = CLI.clientes[cod], cid = nomeCliente(String(row['CIDADE'] || '').trim());
      if(ex && /^\d+\s-\s/.test(ex.cidade || '')) ex.cidade = nomeCliente(ex.cidade);
      if(!ex){ CLI.clientes[cod] = {cod:cod, nome:nomeCliente(cli), cidade:cid, rca:rc, rcaTxt:vend, auto:true}; novos++; }
      else if(!ex.cidade && cid){ ex.cidade = cid; }
    });
  });
  cliSave();
  return novos;
}
async function cliImportarCarteira(inp){
  var f = inp.files[0]; if(!f) return;
  var msg = document.getElementById('cliMsg'); msg.className = 'msg'; msg.textContent = 'Lendo planilha...';
  try{
    var wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
    var col = function(row, nomes){ for(var k in row){ if(nomes.indexOf(cliNorm(k)) >= 0) return row[k]; } return ''; };
    var novos = 0, atual = 0, sem = 0;
    rows.forEach(function(row){
      var cod = String(col(row, ['CODIGO','COD','CODCLI','COD CLIENTE','CODIGO CLIENTE','CODIGO DO CLIENTE','COD. CLIENTE','CODCLIENTE'])).trim();
      var nome = String(col(row, ['NOME','CLIENTE','NOME CLIENTE','NOME DO CLIENTE','RAZAO SOCIAL','FANTASIA'])).trim();
      if(!cod && cliCodigo(nome)){ cod = cliCodigo(nome); nome = nomeCliente(nome); }
      if(!cod){ sem++; return; }
      var cid = nomeCliente(String(col(row, ['CIDADE','MUNICIPIO'])).trim());
      var rr = String(col(row, ['RCA','VENDEDOR','COD RCA','CODIGO RCA'])).trim();
      var num = cliCodigo(rr) || (/^\d+$/.test(rr) ? rr : null);
      var r = data.find(function(x){ return x.cod === num; }) || data.find(function(x){ return cliNorm(x.nome) === cliNorm(nomeCliente(rr)); });
      var ex = CLI.clientes[cod];
      if(ex) atual++; else novos++;
      CLI.clientes[cod] = Object.assign(ex || {}, {cod:cod, nome:nome || (ex && ex.nome) || cod, cidade:cid, rca:r ? r.cod : '', rcaTxt:rr});
    });
    cliSave(); inp.value = '';
    cliFiltrar(); renderTeam();
    msg = document.getElementById('cliMsg'); msg.className = 'msg ok';
    msg.textContent = novos+' novos, '+atual+' atualizados'+(sem ? ', '+sem+' linhas sem código ignoradas' : '')+'.';
  }catch(e){ msg.className = 'msg err'; msg.textContent = 'Erro ao ler a planilha ('+(e && e.message ? e.message : 'erro')+').'; }
}
function cliBackup(){ cliDownload(JSON.stringify(CLI), 'backup-clientes-'+cliHoje()+'.json', 'application/json'); }
function cliRestaurar(inp){
  var f = inp.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var d = JSON.parse(rd.result);
      if(!d || !d.clientes) throw new Error('arquivo inválido');
      if(!confirm('Isso substitui os dados de clientes deste navegador pelos do backup. Continuar?')) return;
      CLI = {clientes:d.clientes, visitas:d.visitas||[], vendas:d.vendas||{}}; cliSave(); renderTeam();
    }catch(e){ alert('Não foi possível restaurar: '+(e && e.message ? e.message : 'erro')); }
    inp.value = '';
  };
  rd.readAsText(f);
}
function cliLinhas(semSit){
  var mes = cliMesAtual(), q = cliNorm(cliF.q);
  return Object.keys(CLI.clientes).map(function(k){ var c = CLI.clientes[k]; return {c:c, sit:cliSituacao(c, mes)}; }).filter(function(x){
    var c = x.c;
    if(cliF.rca && c.rca !== cliF.rca) return false;
    if(cliF.cid && cliNorm(c.cidade) !== cliNorm(cliF.cid)) return false;
    if(q && cliNorm(c.nome).indexOf(q) < 0 && c.cod.indexOf(q) < 0) return false;
    if(!semSit && cliF.sit && x.sit !== cliF.sit) return false;
    return true;
  });
}

/* ----------------------- campanha: indústrias foco e metas ---------------- */
function premioSoma(l){ return (l||[]).reduce(function(a, i){ return a + (i.premio > 0 ? i.premio : PREMIO_INDUSTRIA); }, 0); }
function campMesSelAtual(){ return campMesSel || CAMP.ativo; }
function campRotulo(m){ var p = String(m).split('-'); var n = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][parseInt(p[1],10)-1]; return n ? n+' de '+p[0] : m; }
function campCfg(m){ if(!CAMP.meses[m]) CAMP.meses[m] = {pct:{fixo:0.01, vol:0.003, posit:0.008}, premio:340, rcas:{}}; return CAMP.meses[m]; }
function campRcaCfg(m, cod){
  var c = campCfg(m);
  if(!c.rcas[cod]){ var r = data.find(function(x){ return x.cod === cod; }); c.rcas[cod] = {grupo:(r && r.grupo) || 'divisao', metaVolume:0, metaPosit:0, industrias:[]}; }
  return c.rcas[cod];
}
function aplicarCamp(){
  var c = CAMP.meses[CAMP.ativo]; if(!c) return;
  PCT_FIXO = c.pct.fixo; PCT_VOL = c.pct.vol; PCT_POSIT = c.pct.posit; PREMIO_INDUSTRIA = c.premio;
  data.forEach(function(r){
    var k = c.rcas[r.cod]; if(!k) return;
    r.grupo = k.grupo; r.metaVolume = k.metaVolume; r.metaPosit = k.metaPosit;
    var ant = {}; (r.industrias || []).forEach(function(i){ ant[i.nome] = i; });
    r.industrias = k.industrias.map(function(ci){
      var o = ant[ci.nome], same = o && o.tipo === ci.tipo && (o.pmin||0) === (ci.pmin||0);
      var n = {nome:ci.nome, tipo:ci.tipo, meta:ci.meta, realizado: same ? o.realizado : 0, clientes: same ? o.clientes : [],
               ps: (o && o.ps) ? o.ps : {def:{v:0,c:[]}, lib:{v:0,c:[]}, pv:{v:0,c:[]}, pl:{v:0,c:[]}}};
      if(ci.pmin > 0) n.pmin = ci.pmin; if(ci.premio > 0) n.premio = ci.premio; if(ci.esc) n.esc = ci.esc;
      return n;
    });
    r.metaInd = r.industrias.filter(function(i){ return i.tipo === 'qtd'; }).reduce(function(a,i){ return a + (i.meta||0); }, 0);
    r.ind = r.industrias.filter(function(i){ return i.tipo === 'qtd'; }).reduce(function(a,i){ return a + (i.realizado||0); }, 0);
  });
}
function campCarregar(){
  try{ var d = JSON.parse(localStorage.getItem('painel870_camp_draft') || 'null'); if(d && d.meses && d.rev > (CAMP.rev || 0)){ CAMP = d; campDirty = true; } }catch(e){}
  aplicarCamp();
}
function campSalvar(m){
  if(m === CAMP.ativo) aplicarCamp();
  CAMP.rev = Date.now();
  try{ localStorage.setItem('painel870_camp_draft', JSON.stringify(CAMP)); }catch(e){}
  campDirty = true; renderTeam();
}
function campGerarArquivo(){ baixarArquivoAtualizado(buildDoc(data, LAST_UPDATE), 'index.html'); campDirty = false; renderTeam(); }
function campV(id){ var e = document.getElementById(id); return e ? e.value : ''; }
function campTemInd(k, nome, ign){ return k.industrias.some(function(i, ix){ return ix !== ign && cliNorm(i.nome) === cliNorm(nome); }); }
function campMapForn(nome, trecho){ trecho = String(trecho || '').trim(); if(trecho && !IND_MAP[nome]) IND_ALIAS[nome] = trecho.toUpperCase(); }
function campMudarMes(v){ if(/^\d{4}-\d{2}$/.test(v)){ campMesSel = v; renderTeam(); } }
function campMudarRca(v){ campRcaSel = v; renderTeam(); }
function campCopiar(){
  var m = campMesSelAtual(), src = campV('cc_src');
  if(!src || src === m || !CAMP.meses[src]) return;
  if(!confirm('Copiar a configuração de '+campRotulo(src)+' para '+campRotulo(m)+'?'+(CAMP.meses[m] ? ' Isso substitui o que já existe em '+campRotulo(m)+'.' : ''))) return;
  CAMP.meses[m] = JSON.parse(JSON.stringify(CAMP.meses[src])); campSalvar(m);
}
function campAtivar(){
  var m = campMesSelAtual();
  if(!confirm('Usar '+campRotulo(m)+' como mês ativo? As telas e a comissão passam a usar as metas e indústrias deste mês. Reprocesse os relatórios do mês depois.')) return;
  CAMP.ativo = m; campSalvar(m);
}
function campSalvarParams(){
  var m = campMesSelAtual(), f = parseNum(campV('cp_fixo'))/100, v = parseNum(campV('cp_vol'))/100, p = parseNum(campV('cp_pos'))/100, pr = parseNum(campV('cp_prem'));
  if([f,v,p].some(function(x){ return !(x >= 0 && x <= 1); }) || !(pr >= 0)){ alert('Valores inválidos.'); return; }
  if(!confirm('Salvar os percentuais e o prêmio de '+campRotulo(m)+'?')) return;
  var c = campCfg(m); c.pct = {fixo:f, vol:v, posit:p}; c.premio = pr; campSalvar(m);
}
function campSalvarRca(){
  var m = campMesSelAtual(), cod = campRcaSel; if(!cod) return;
  if(!confirm('Salvar as metas e o grupo deste RCA em '+campRotulo(m)+'?')) return;
  var k = campRcaCfg(m, cod); k.metaVolume = parseNum(campV('cr_mv')); k.metaPosit = parseNum(campV('cr_mp')); k.grupo = campV('cr_grupo') || k.grupo; campSalvar(m);
}
function campIndLer(ix){
  var g = function(n){ return campV(n+'_'+ix); };
  return {esc:g('ci_esc').trim(), nome:g('ci_nome').trim(), tipo:g('ci_tipo') === 'qtd' ? 'qtd' : 'valor', pmin:parseNum(g('ci_pmin'))||0, premio:parseNum(g('ci_prem'))||0, meta:parseNum(g('ci_meta'))||0};
}
function campIndSalvar(ix){
  var m = campMesSelAtual(), k = campRcaCfg(m, campRcaSel), v = campIndLer(ix), novo = ix === 'n';
  if(!v.nome){ alert('Informe o nome da indústria.'); return; }
  if(campTemInd(k, v.nome, novo ? -1 : ix)){ alert('Essa indústria já existe para este RCA neste mês.'); return; }
  if(!confirm((novo ? 'Adicionar ' : 'Salvar ')+v.nome+' para este RCA em '+campRotulo(m)+'?')) return;
  if(novo){ campMapForn(v.nome, campV('ci_trecho_n')); k.industrias.push(v); } else k.industrias[ix] = v;
  campSalvar(m);
}
function campIndExcluir(ix){
  var m = campMesSelAtual(), k = campRcaCfg(m, campRcaSel);
  if(!confirm('Excluir '+k.industrias[ix].nome+' deste RCA em '+campRotulo(m)+'?')) return;
  k.industrias.splice(ix, 1); campSalvar(m);
}
function campAlvos(){ return data.filter(function(r){ var e = document.getElementById('bk_'+r.cod); return e && e.checked; }).map(function(r){ return r.cod; }); }
function campMarcar(modo){
  var c = CAMP.meses[campMesSelAtual()] || {rcas:{}};
  data.forEach(function(r){ var e = document.getElementById('bk_'+r.cod); if(!e) return;
    var g = (c.rcas[r.cod] || r).grupo; e.checked = modo === 'todos' ? true : (modo === 'nenhum' ? false : g === modo); });
}
function campBulkInd(){
  var m = campMesSelAtual(), al = campAlvos(), nome = campV('bk_nome').trim();
  if(!al.length || !nome){ alert('Marque os RCAs e informe a indústria.'); return; }
  if(!confirm('Aplicar '+nome+' a '+al.length+' RCA(s) em '+campRotulo(m)+'? Quem já tem essa indústria é atualizado; os demais recebem a indústria nova.')) return;
  var metaTxt = campV('bk_meta').trim(), escv = campV('bk_esc').trim();
  campMapForn(nome, campV('bk_trecho'));
  al.forEach(function(cod){
    var k = campRcaCfg(m, cod), ix = k.industrias.findIndex(function(i){ return cliNorm(i.nome) === cliNorm(nome); });
    var vals = {tipo:campV('bk_tipo') === 'qtd' ? 'qtd' : 'valor', pmin:parseNum(campV('bk_pmin'))||0, premio:parseNum(campV('bk_prem'))||0};
    if(ix >= 0){ Object.assign(k.industrias[ix], vals); if(metaTxt) k.industrias[ix].meta = parseNum(metaTxt); if(escv) k.industrias[ix].esc = escv; }
    else k.industrias.push(Object.assign({esc:escv, nome:nome, meta:metaTxt ? parseNum(metaTxt) : 0}, vals));
  });
  campSalvar(m);
}
function campBulkRemover(){
  var m = campMesSelAtual(), al = campAlvos(), nome = campV('bk_nome').trim();
  if(!al.length || !nome){ alert('Marque os RCAs e informe a indústria a remover.'); return; }
  if(!confirm('Remover '+nome+' de '+al.length+' RCA(s) em '+campRotulo(m)+'?')) return;
  al.forEach(function(cod){ var k = campRcaCfg(m, cod); k.industrias = k.industrias.filter(function(i){ return cliNorm(i.nome) !== cliNorm(nome); }); });
  campSalvar(m);
}
function campBulkMetas(){
  var m = campMesSelAtual(), al = campAlvos(), mv = campV('bk_mv').trim(), mp = campV('bk_mp').trim();
  if(!al.length || (!mv && !mp)){ alert('Marque os RCAs e informe a meta de volume e/ou de positivação.'); return; }
  if(!confirm('Aplicar a meta a '+al.length+' RCA(s) em '+campRotulo(m)+'?')) return;
  al.forEach(function(cod){ var k = campRcaCfg(m, cod); if(mv) k.metaVolume = parseNum(mv); if(mp) k.metaPosit = parseNum(mp); });
  campSalvar(m);
}

    + '<tr><td>'+campInput('ci_esc_n','',70)+'</td><td>'+campInput('ci_nome_n','',120)+'</td><td>'+campTipoSel('ci_tipo_n','valor')+'</td><td>'+campInput('ci_pmin_n','',70)+'</td><td>'+campInput('ci_prem_n', nf(cfg.premio,2), 80)+'</td><td>'+campInput('ci_meta_n','',80)+'</td>'

    + '</tbody><tfoot><tr><td colspan="4"><b>Prêmio total das indústrias foco</b></td><td class="num"><b>'+money(premioSoma(k.industrias.map(function(i){ return {premio:i.premio > 0 ? i.premio : cfg.premio}; })))+'</b></td><td colspan="2">'+k.industrias.length+' indústria(s)</td></tr></tfoot></table></div>'
    + '<label class="field">Para indústria nova: trecho do nome do fornecedor no relatório (ex.: SALON)'+campInput('ci_trecho_n','')+'</label>'
    + '<div class="note">Foco Volume = meta em R$. Foco Positivação = meta em clientes, e só conta o cliente que comprou o valor da positivação mínima. Mudou o foco ou a mínima? Reprocesse os relatórios para recalcular.</div></div>';
  h += '<div class="card"><div class="card-h"><b>Edição em massa</b></div><div class="note">Marque os RCAs que vão receber a alteração. Os demais não mudam.</div>'
    + '<div class="rowtools noprint"><button class="btn" style="width:auto;padding:7px 12px" onclick="campMarcar(\'divisao\')">Perfumaria e Divisão</button><button class="btn" style="width:auto;padding:7px 12px" onclick="campMarcar(\'geral\')">Perfumaria Geral</button><button class="btn" style="width:auto;padding:7px 12px" onclick="campMarcar(\'todos\')">Todos</button><button class="btn" style="width:auto;padding:7px 12px" onclick="campMarcar(\'nenhum\')">Limpar</button></div>'
    + '<div class="cgrid">'+data.map(function(r){ return '<label class="ck" style="cursor:pointer"><input type="checkbox" id="bk_'+esc(r.cod)+'"> '+esc(r.nome)+'<span>'+esc(GRUPOS[(cfg.rcas[r.cod] || r).grupo] || '')+'</span></label>'; }).join('')+'</div>'
    + '<div class="grid2"><label class="field">Indústria'+campInput('bk_nome','')+'</label><label class="field">Foco<select class="mi" id="bk_tipo"><option value="valor">Volume</option><option value="qtd">Positivação</option></select></label>'
    + '<label class="field">ESC. (opcional)'+campInput('bk_esc','')+'</label><label class="field">Posit. mínima (R$)'+campInput('bk_pmin','')+'</label>'
    + '<label class="field">Prêmio (R$)'+campInput('bk_prem', nf(cfg.premio,2))+'</label><label class="field">Meta (vazio = não alterar)'+campInput('bk_meta','')+'</label>'
    + '<label class="field">Trecho do fornecedor (se indústria nova)'+campInput('bk_trecho','')+'</label></div>'
    + '<div class="rowtools"><button class="btn" style="width:auto" onclick="campBulkInd()">Aplicar indústria aos marcados</button><button class="btn" style="width:auto;background:var(--panel3);border-color:var(--line)" onclick="campBulkRemover()">Remover indústria dos marcados</button></div>'
    + '<div class="grid2"><label class="field">Meta de volume (R$)'+campInput('bk_mv','')+'</label><label class="field">Meta de positivação (clientes)'+campInput('bk_mp','')+'</label></div>'
    + '<div class="rowtools"><button class="btn" style="width:auto" onclick="campBulkMetas()">Aplicar metas aos marcados</button></div></div>';
  return h;
}

/* -------------------------------- equipe --------------------------------- */
function renderTeam(){
  viewState = {t:'team'};
  cliQuery = '';
  var app = document.getElementById('app');

  var tot = {fat:0, def:0, lib:0, pv:0, pl:0, metaVol:0, vol:0, posit:0, metaPosit:0, ind:0, metaInd:0, rcasOk:0, indOk:0, indTot:0, comissoes:0};
  data.forEach(function(r){
    tot.fat += Number(r.faturado)||0; tot.def += Number(r.definido)||0;
    tot.lib += Number(r.liberado)||0; tot.pv += Number(r.paradoVenc)||0; tot.pl += Number(r.paradoLimite)||0;
    tot.metaVol += Number(r.metaVolume)||0; tot.vol += vol(r);
    tot.posit += positSel(r); tot.metaPosit += Number(r.metaPosit)||0;
    tot.ind += Number(r.ind)||0; tot.metaInd += Number(r.metaInd)||0;
    (r.industrias||[]).forEach(function(i){ tot.indTot++; if(i.meta > 0 && (i.realizado||0) >= i.meta) tot.indOk++; });
    if(r.metaVolume > 0 && (Number(r.faturado)||0) >= r.metaVolume) tot.rcasOk++;
    tot.comissoes += calcComissao(r).total;
  });
  tot.somaVol = tot.metaVol; tot.somaPosit = tot.metaPosit;
  if(META_EQ.volume > 0) tot.metaVol = META_EQ.volume;
  if(META_EQ.posit > 0) tot.metaPosit = META_EQ.posit;

  var pVolT = pctOf(tot.vol, tot.metaVol), pPositT = pctOf(tot.posit, tot.metaPosit);
  var parado = tot.pv + tot.pl;
  var carteira = pillSum(tot);

  /* indústrias consolidadas */
  var indAgg = {};
  data.forEach(function(r){
    (r.industrias||[]).forEach(function(i){
      if(!indAgg[i.nome]) indAgg[i.nome] = {meta:0, tipo:i.tipo, realizado:0, rcas:0, rcasOk:0};
      var a = indAgg[i.nome];
      a.meta += Number(i.meta)||0; a.rcas++;
      if(i.meta > 0 && (i.realizado||0) >= i.meta) a.rcasOk++;
      a.realizado += indSel(i).realizado;
    });
  });
  Object.keys(indAgg).forEach(function(n){
    indAgg[n].soma = indAgg[n].meta;
    if(META_EQ.ind && META_EQ.ind[n] > 0) indAgg[n].meta = META_EQ.ind[n];
  });
  var indKeys = Object.keys(indAgg);

  /* tabela de RCAs (ordenável) */
  var rows = data.slice();
  var getVal = function(r){
    switch(sortKey){
      case 'nome': return String(r.nome||'').toLowerCase();
      case 'cidade': return String(r.cidade||'').toLowerCase();
      case 'vol': return vol(r);
      case 'posit': return positSel(r);
      case 'pposit': return pctOf(positSel(r), r.metaPosit);
      case 'com': return calcComissao(r).total;
      case 'pct': default: return pctOf(vol(r), r.metaVolume);
    }
  };
  rows.sort(function(a,b){
    var x = getVal(a), y = getVal(b);
    if(typeof x === 'string') return sortDir * x.localeCompare(y);
    return sortDir * (x - y);
  });

  var indAggSorted = indKeys.slice().sort(function(a,b){ return pctOf(indAgg[b].realizado, indAgg[b].meta) - pctOf(indAgg[a].realizado, indAgg[a].meta); });
  var rankVol = data.slice().sort(function(a,b){ return pctOf(vol(b), b.metaVolume) - pctOf(vol(a), a.metaVolume); });

  var html = '';

  html += '<button class="backlink noprint" onclick="logout()">← trocar código</button>'
    + '<h2 class="ptitle">Panorama da equipe</h2>'
    + '<div class="psub">'+ (refMonth() ? 'Mês de referência: '+refMonth()+' · ' : '') + data.length + ' RCAs · 6 indústrias foco · atualizado em '+esc(LAST_UPDATE||'—') +'</div>';
  html += teamSegHTML() + fonteBanner();
  if(teamTab === 'camp'){ app.innerHTML = html + mioloCampanha(); return; }
  if(teamTab === 'metas' && !FONTES.ven){ app.innerHTML = html + avisoFonteHTML('As metas por dia e por semana dependem do relatório de vendas. Envie esse relatório para vê-las.'); return; }
  if(teamTab === 'metas'){ app.innerHTML = html + mioloMetasEquipe(); return; }
  if(teamTab === 'clientes'){ app.innerHTML = html + mioloCarteira(); return; }
  if(teamTab === 'atend'){ app.innerHTML = html + mioloAtend(); return; }
  if(!FONTES.ven){ app.innerHTML = html + mioloSoSituacaoEquipe(); return; }

  /* KPIs principais */
  html += '<div class="kpis">'
    + kpiHTML(pillLabel(), money(carteira), 'Carteira somando o que está selecionado')
    + kpiHTML('Volume vs. meta', money(tot.vol), 'meta '+money(tot.metaVol)+' · '+pct1(pVolT), tone(pVolT))
    + kpiHTML('Positivação', fmt(tot.posit)+' <small>/ '+fmt(tot.metaPosit)+'</small>', 'clientes positivados · '+pct1(pPositT), tone(pPositT))
    + kpiHTML('Faturado', money(tot.fat), 'base do cálculo de comissão')
    + (FONTES.sit ? kpiHTML('Vendas paradas', money(parado), money(tot.pv)+' vencido · '+money(tot.pl)+' limite', parado > 0 ? 'bad' : 'ok') : '')
    + kpiHTML('Comissão estimada', money(tot.comissoes), 'simulação sobre o faturado do mês', 'ok')
    + kpiHTML('RCAs na meta de faturamento', tot.rcasOk+' <small>/ '+data.length+'</small>', tot.indOk+' de '+tot.indTot+' indústrias foco na meta', tot.rcasOk > data.length/2 ? 'ok' : 'warn')
    + '</div>';

  /* funil + positivo */
  html += '<div class="grid2">'
    + '<div class="card"><div class="card-h"><b>Meta de volume da equipe</b><span class="badge '+(pVolT>=100?'g':pVolT>=70?'a':'r')+'">'+pct1(pVolT)+'</span></div>'
      + '<div class="hero">' + ringHTML(pVolT, barColor(pVolT), pct1(pVolT), money(tot.vol)+' de '+money(tot.metaVol))
      + '<div class="hero-info">' + targetNote(tot.vol, tot.metaVol, 'rs')
      + (FONTES.sit ? '<div class="note">Faturado '+money(tot.fat)+' · Definido '+money(tot.def)+' · Liberado '+money(tot.lib)+'</div>' : '')
      + (META_EQ.volume > 0 ? '<div class="note">Meta da supervisão: '+money(META_EQ.volume)+' (soma das metas dos RCAs: '+money(tot.somaVol)+')</div>' : '<div class="note">Meta = soma das metas individuais dos RCAs.</div>')
      + '</div></div></div>'
    + '<div class="card"><div class="card-h"><b>Positivação da equipe</b><span class="badge '+(pPositT>=100?'g':pPositT>=70?'a':'r')+'">'+pct1(pPositT)+'</span></div>'
      + '<div class="hero">' + ringHTML(pPositT, barColor(pPositT), fmt(tot.posit)+'/'+fmt(tot.metaPosit), 'clientes positivados')
      + '<div class="hero-info">' + targetNote(tot.posit, tot.metaPosit, 'qtd')
      + '<div class="note">Contando: '+pillLabel()+'</div>'
      + (META_EQ.posit > 0 ? '<div class="note">Meta da supervisão: '+fmt(META_EQ.posit)+' clientes (soma dos RCAs: '+fmt(tot.somaPosit)+')</div>' : '')
      + '</div></div></div>'
    + '</div>';

  /* clientes por situação */
  html += '<div class="card"><div class="card-h"><b>Clientes por situação · equipe</b></div>' + statusChipsHTML(data)
    + '<details class="mini noprint"><summary>Ver clientes atendidos por RCA</summary>'
    + data.map(function(r){
        return '<details class="mini"><summary><b>'+esc(r.nome)+'</b> — '+clientesSel(r).length+' cliente(s)</summary>'
          + clientListHTML(clientesSel(r)) + statusGroupsHTML(r) + '</details>';
      }).join('')
    + '</details></div>';

  html += clientesStatusEquipeHTML();

  /* indústrias foco */
  html += '<div class="sec">Indústrias foco · equipe</div><div class="grid2">'
    + indAggSorted.map(function(nome){
        var i = indAgg[nome], p = pctOf(i.realizado, i.meta);
        return '<div class="card"><div class="card-h"><b>'+esc(nome)+'</b>'
          + '<span class="badge '+(i.tipo==='qtd'?'g':'a')+'">'+(i.tipo==='qtd'?'positivação':'venda em R$')+'</span></div>'
          + '<div class="ind-v"><span class="strong">'+unid(i.realizado, i.tipo)+'</span>'
          + '<span class="muted small">meta '+unid(i.meta, i.tipo)+'</span>'
          + '<span class="pc" style="color:'+barColor(p)+'">'+pct1(p)+'</span></div>'
          + barHTML(p, barColor(p)) + targetNote(i.realizado, i.meta, i.tipo)
          + '<div class="note">'+i.rcasOk+' de '+i.rcas+' RCAs na meta</div>'
          + '<details class="mini noprint"><summary>Ver clientes por RCA</summary>'
          + data.map(function(r){
              var ind = (r.industrias||[]).find(function(x){ return x.nome === nome; });
              var cl = ind ? indSel(ind).clientes : [];
              return ind ? '<details class="mini"><summary><b>'+esc(r.nome)+'</b> — '+cl.length+' cliente(s)</summary>'+clientListHTML(cl)+'</details>' : '';
            }).join('')
          + '</details></div>';
      }).join('')
    + '</div>';

  /* tabela de RCAs */
  var th = function(label, key, num){
    var sel = (sortKey === key) ? (sortDir < 0 ? ' ↓' : ' ↑') : '';
    return '<th'+(num?' class="num"':'')+' data-act="1" onclick="setSort(\''+key+'\')" title="Ordenar por '+label+'">'+label+sel+'</th>';
  };
  html += '<div class="sec">Desempenho por RCA</div>'
    + '<div class="tblwrap"><table class="tbl"><thead><tr>'
    + th('RCA','nome') + th('Cidade','cidade') + th('Volume selecionado','vol',1)
    + th('% da meta','pct',1) + th('Positivação','posit',1) + th('% posit.','pposit',1) + th('Comissão','com',1)
    + '</tr></thead><tbody>'
    + rows.map(function(r){
        var v = vol(r), p = pctOf(v, r.metaVolume);
        var po = positSel(r), pp = pctOf(po, r.metaPosit);
        var c = calcComissao(r);
        return '<tr class="'+(p < 70 ? 'rowbad' : '')+'" onclick="abrirRCA(\''+esc(r.cod)+'\')" title="Abrir painel de '+esc(r.nome)+'">'
          + '<td><b>'+esc(r.nome)+'</b>'+(r.bloqueado?' <span class="badge r">bloqueado</span>':'')
            + '<div class="small muted mono">#'+esc(r.cod)+'</div></td>'
          + '<td class="muted">'+esc(r.cidade||'—')+'</td>'
          + '<td class="num">'+money(v)+'</td>'
          + '<td><div class="pctcell"><span style="color:'+barColor(p)+'">'+pct1(p)+'</span>'+barHTML(p, barColor(p))+'</div></td>'
          + '<td class="num">'+fmt(po)+' <span class="muted">/ '+fmt(r.metaPosit)+'</span></td>'
          + '<td class="num" style="color:'+barColor(pp)+'">'+pct1(pp)+'</td>'
          + '<td class="num" style="color:var(--green)">'+money(c.total)+'</td>'
          + '</tr>';
      }).join('')
    + '</tbody><tfoot><tr style="font-weight:700"><td>Equipe</td><td></td>'
    + '<td class="num">'+money(tot.vol)+'</td>'
    + '<td class="num">'+pct1(pVolT)+'</td>'
    + '<td class="num">'+fmt(tot.posit)+' / '+fmt(tot.metaPosit)+'</td>'
    + '<td class="num">'+pct1(pPositT)+'</td>'
    + '<td class="num" style="color:var(--green)">'+money(tot.comissoes)+'</td></tr></tfoot></table></div>'
    + '<div class="rowtools noprint"><span class="small muted">Clique em uma linha para abrir o detalhe do RCA. Toque no título de uma coluna para ordenar.</span></div>';

  /* 10 maiores indústrias */
  html += '<div class="sec">10 maiores indústrias · equipe</div>' + rankIndHTML(fornTotalEquipe(), 'Top 10 indústrias por faturamento · equipe');

  /* ranking + comissão */
  html += '<div class="grid2">'
    + '<div class="card"><div class="card-h"><b>Ranking · % da meta de volume</b></div><div class="alist">'
      + rankVol.map(function(r, idx){
          var p = pctOf(vol(r), r.metaVolume);
          return '<div class="arow" onclick="abrirRCA(\''+esc(r.cod)+'\')"><span><b class="mono" style="color:var(--muted)">'+(idx+1)+'º</b> '+esc(r.nome)+'</span>'
            + '<span class="mono" style="color:'+barColor(p)+'">'+pct1(p)+'</span></div>';
        }).join('')
      + '</div></div>'
    + '<div class="card"><div class="card-h"><b>Comissão estimada por RCA</b><span class="badge b">total '+money(tot.comissoes)+'</span></div><div class="alist">'
      + data.map(function(r){ return {r:r, c:calcComissao(r)}; })
          .sort(function(a,b){ return b.c.total - a.c.total; })
          .map(function(x){
            return '<div class="arow" onclick="abrirRCA(\''+esc(x.r.cod)+'\')"><span>'+esc(x.r.nome)+'</span>'
              + '<span class="mono" style="color:var(--green)">'+money(x.c.total)+'</span></div>';
          }).join('')
      + '</div><div class="note">Fixo 1% + 0,30% (meta de volume) + 0,80% (positivação) sobre o faturado · prêmio de '+money(PREMIO_INDUSTRIA)+' por indústria foco batida.</div></div>'
    + '</div>';

  /* atualização de dados */
  html += '<div class="sec noprint">Administração</div>'
    + '<details class="acc noprint"><summary>Atualizar dados da equipe (.xlsx ou colagem manual)</summary>'
    + '<div class="note">Envie os relatórios do dia exportados do sistema — <b>os dois ou só um</b> — use o botão de cada relatório para atualizar individualmente. O painel mostra <b>só o que você enviar</b>: só vendas = só o faturado; só situação = só a situação; os dois = tudo. Todo o cálculo acontece aqui no navegador — faturado, definido, liberado, parado vencido, parado limite, positivação e realizado por indústria foco. No fim, um novo <b>index.html</b> é baixado para você publicar.</div>'
    + '<label class="field">Mês a que os relatórios se referem (usado na aba Clientes)<input type="month" id="refMesIn" value="'+cliMesPadrao()+'"></label>'
    + '<label class="field">1. Relatório de situação (.xlsx, opcional) — colunas SITUACAO / VENDEDOR / CLIENTE / FORNECEDOR / Valor R$'
    + '<input class="filein" type="file" id="fileSituacao" accept=".xlsx"></label>'
    + '<div class="rowtools"><button class="btn" style="width:auto" onclick="processarArquivos(\'sit\')">Atualizar só a situação</button></div>'
    + '<label class="field">2. Relatório de vendas fechadas (.xlsx, opcional) — colunas VENDEDOR / CLIENTE / FORNECEDOR / Venda R$'
    + '<input class="filein" type="file" id="fileVendas" accept=".xlsx"></label>'
    + '<div class="rowtools"><button class="btn" style="width:auto" onclick="processarArquivos(\'ven\')">Atualizar só as vendas</button></div>'
    + '<div class="rowtools"><button class="btn" style="width:auto" onclick="processarArquivos()">Atualizar os dois e gerar index.html</button><span class="msg" id="updMsg"></span></div>'
    + '<details class="mini"><summary>Prefiro colar os números manualmente</summary>'
    + '<div class="note">Cole linhas copiadas do Excel (separadas por tabulação) na ordem: <b>código · faturado · definido · liberado · parado vencido · parado limite · positivação</b>. Esta opção não atualiza o realizado por indústria foco.</div>'
    + '<textarea class="upd" id="updTextarea" placeholder="11655&#9;150000&#9;800&#9;500&#9;0&#9;0&#9;32"></textarea>'
    + '<div class="rowtools"><button class="btn" style="width:auto" onclick="salvarEPublicar()">Salvar e gerar index.html</button></div>'
    + '</details></details>';

  html += senhasHTML();

  /* metas */
  html += '<details class="acc noprint" id="metasBox"><summary>Editar metas dos RCAs e da equipe</summary>'
    + '<div class="note">Ajuste a meta de volume, de positivação ou de qualquer indústria foco. Os campos mostram o realizado atual para você comparar. Ao salvar, um <b>index.html</b> novo é baixado para publicação.</div>'
    + '<div class="card" style="margin-top:12px;box-shadow:none"><div class="card-h"><b>Meta da equipe (supervisão)</b></div>'
    + '<div class="note">Vale só para o total da equipe. Deixe em branco para usar a soma das metas dos RCAs (número sugerido no campo).</div><div class="grid2" style="margin-top:8px">'
    + '<label class="field">Meta volume da equipe (R$)<input type="text" id="eq_vol" value="'+(META_EQ.volume>0?META_EQ.volume:'')+'" placeholder="soma RCAs: '+fmt(tot.somaVol)+'"></label>'
    + '<label class="field">Meta positivação da equipe (clientes)<input type="text" id="eq_pos" value="'+(META_EQ.posit>0?META_EQ.posit:'')+'" placeholder="soma RCAs: '+fmt(tot.somaPosit)+'"></label>'
    + indKeys.map(function(n, idx){
        var i = indAgg[n];
        return '<label class="field">Meta '+esc(n)+' da equipe ('+(i.tipo==='qtd'?'clientes':'R$')+')<input type="text" id="eq_ind_'+idx+'" value="'+((META_EQ.ind && META_EQ.ind[n]>0)?META_EQ.ind[n]:'')+'" placeholder="soma RCAs: '+fmt(i.soma)+'"></label>';
      }).join('')
    + '</div><div class="note strong" id="metasTot" style="margin-top:8px"></div></div>'
    + '<div class="note strong" style="margin-top:12px">Metas individuais dos RCAs</div>'
    + data.map(function(r){
        var pv = pctOf(Number(r.faturado)||0, r.metaVolume), pp = pctOf(r.posit||0, r.metaPosit);
        return '<details class="mini"><summary><b>'+esc(r.nome)+'</b> — volume '+pct1(pv)+' · positivação '+pct1(pp)+(r.bloqueado?' · <span class="neg">bloqueado</span>':'')+'</summary>'
          + '<div class="grid2">'
          + '<label class="field chk" style="margin-top:10px"><input type="checkbox" id="bloq_'+esc(r.cod)+'"'+(r.bloqueado?' checked':'')+'> Bloquear acesso deste RCA</label>'
          + '<label class="field">Meta volume (R$) — faturado '+money(r.faturado)+'<input type="text" oninput="atualizarTotaisMetas()" id="meta_vol_'+esc(r.cod)+'" value="'+r.metaVolume+'"></label>'
          + '<label class="field">Meta positivação (clientes) — positivados '+fmt(r.posit||0)+'<input type="text" oninput="atualizarTotaisMetas()" id="meta_pos_'+esc(r.cod)+'" value="'+r.metaPosit+'"></label>'
          + (r.industrias||[]).map(function(i, idx){
              return '<label class="field">Meta '+esc(i.nome)+' ('+(i.tipo==='qtd'?'clientes':'R$')+') — realizado '+unid(i.realizado, i.tipo)+'<input type="text" oninput="atualizarTotaisMetas()" id="meta_ind_'+esc(r.cod)+'_'+idx+'" value="'+i.meta+'"></label>';
            }).join('')
          + '</div></details>';
      }).join('')
    + '<div class="rowtools"><button class="btn" style="width:auto" onclick="salvarMetas()">Salvar alterações e gerar index.html</button><span class="msg" id="metasMsg"></span></div>'
    + '</details>';

  app.innerHTML = html;
  atualizarTotaisMetas();
}

function setSort(k){
  if(sortKey === k){ sortDir = -sortDir; } else { sortKey = k; sortDir = (k === 'nome' || k === 'cidade') ? 1 : -1; }
  renderTeam();
  var box = document.getElementById('metasBox');
  if(box) box.open = false;
}

function atualizarTotaisMetas(){
  var el = document.getElementById('metasTot');
  if(!el) return;
  var v = 0, p = 0, ind = {};
  data.forEach(function(r){
    var a = document.getElementById('meta_vol_'+r.cod), b = document.getElementById('meta_pos_'+r.cod);
    v += a ? parseNum(a.value) : (Number(r.metaVolume)||0);

    });

function normalizeData(){
  (data||[]).forEach(function(r){
    r.faturado = Number(r.faturado)||0; r.definido = Number(r.definido)||0;
    r.liberado = Number(r.liberado)||0; r.paradoVenc = Number(r.paradoVenc)||0;
    r.paradoLimite = Number(r.paradoLimite)||0; r.metaVolume = Number(r.metaVolume)||0;
    r.metaPosit = Number(r.metaPosit)||0; r.posit = Number(r.posit)||0;
    r.clientesPositivados = r.clientesPositivados || [];
    r.industrias = r.industrias || [];
    r.industrias.forEach(function(i){
      i.meta = Number(i.meta)||0; i.realizado = Number(i.realizado)||0;
      i.clientes = i.clientes || [];
      i.ps = i.ps || {};
      ['def','lib','pv','pl'].forEach(function(k){
        if(!i.ps[k]) i.ps[k] = {v:0, c:[]};
        i.ps[k].v = Number(i.ps[k].v)||0; i.ps[k].c = i.ps[k].c || [];
      });
    });
    if(r.metaInd === undefined){
      r.metaInd = r.industrias.filter(function(i){ return i.tipo === 'qtd'; }).reduce(function(a,i){ return a + i.meta; }, 0);
    }
    if(r.ind === undefined){
      r.ind = r.industrias.filter(function(i){ return i.tipo === 'qtd'; }).reduce(function(a,i){ return a + (i.realizado||0); }, 0);
    }
  });
}

/* --------------------------- leitura de planilhas ------------------------- */
function parseSituacao(rows){
  var agg = {};
  var revMap = reverseIndMap();
  rows.forEach(function(row){
    var sit = row['SITUACAO'], vend = row['VENDEDOR'];
    if(!vend || sit === 'TOTAL' || String(vend).indexOf(' - ') < 0) return;
    var cod = String(vend).split(' - ')[0].trim();
    if(!agg[cod]) agg[cod] = {definido:0, liberado:0, paradoVenc:0, paradoLimite:0, cliSt:{}, cliVal:{}, clientInd:{}, ind:{}};
    var valor = parseNum(row['Valor R$']);
    var s = String(sit||'');
    if(s.indexOf('DEFINIDO') >= 0) agg[cod].definido += valor;
    else if(s.indexOf('LIBERADO') >= 0) agg[cod].liberado += valor;
    else if(s.indexOf('VENCIDO') >= 0) agg[cod].paradoVenc += valor;
    else if(s.indexOf('LIMITE') >= 0) agg[cod].paradoLimite += valor;
    var k = s.indexOf('DEFINIDO') >= 0 ? 'def' : (s.indexOf('LIBERADO') >= 0 ? 'lib' : (s.indexOf('VENCIDO') >= 0 ? 'pv' : (s.indexOf('LIMITE') >= 0 ? 'pl' : null)));
    var cli = row['CLIENTE'];
    if(k && cli){
      agg[cod].cliSt[cli] = agg[cod].cliSt[cli] || {};
      agg[cod].cliSt[cli][k] = true;
      agg[cod].cliVal = agg[cod].cliVal || {};
      agg[cod].cliVal[cli] = agg[cod].cliVal[cli] || {};
      agg[cod].cliVal[cli][k] = (agg[cod].cliVal[cli][k]||0) + valor;
      var fornRaw = String(row['FORNECEDOR']||'');
      var forn = fornRaw.indexOf(' - ') >= 0 ? fornRaw.split(' - ').slice(1).join(' - ').trim() : fornRaw.trim();
      if(revMap[forn]){
        agg[cod].clientInd[cli] = agg[cod].clientInd[cli] || {};
        agg[cod].clientInd[cli][revMap[forn]] = true;
        var ib = agg[cod].ind[revMap[forn]] = agg[cod].ind[revMap[forn]] || {};
        ib[k] = ib[k] || {v:0, c:{}};
        ib[k].v += valor;
        ib[k].c[cli] = true;
      }
    }
  });
  return agg;
}

function parseVendas(rows){
  var fat = {}, clientesSet = {}, fornClientes = {}, fornValor = {}, clientInd = {}, cliVenda = {}, fornCliVal = {};
  var revMap = reverseIndMap();
  rows.forEach(function(row){
    var vend = row['VENDEDOR'];
    if(!vend || String(vend).indexOf(' - ') < 0) return;
    var cod = String(vend).split(' - ')[0].trim();
    var venda = parseNum(row['Venda R$']);
    fat[cod] = (fat[cod]||0) + venda;
    cliVenda[cod] = cliVenda[cod] || {};
    cliVenda[cod][row['CLIENTE']] = (cliVenda[cod][row['CLIENTE']]||0) + venda;
    clientesSet[cod] = clientesSet[cod] || {};
    clientesSet[cod][row['CLIENTE']] = true;
    var fornRaw = String(row['FORNECEDOR']||'');
    var forn = fornRaw.indexOf(' - ') >= 0 ? fornRaw.split(' - ').slice(1).join(' - ').trim() : fornRaw.trim();
    fornClientes[cod] = fornClientes[cod] || {};
    fornClientes[cod][forn] = fornClientes[cod][forn] || {};
    fornClientes[cod][forn][row['CLIENTE']] = true;
    fornCliVal[cod] = fornCliVal[cod] || {}; fornCliVal[cod][forn] = fornCliVal[cod][forn] || {};
    fornCliVal[cod][forn][row['CLIENTE']] = (fornCliVal[cod][forn][row['CLIENTE']]||0) + venda;
    fornValor[cod] = fornValor[cod] || {};
    fornValor[cod][forn] = (fornValor[cod][forn]||0) + venda;
    var indN = indDoForn(forn, revMap);
    if(indN){
      clientInd[cod] = clientInd[cod] || {};
      clientInd[cod][row['CLIENTE']] = clientInd[cod][row['CLIENTE']] || {};
      clientInd[cod][row['CLIENTE']][indN] = true;
    }
  });
  return {fat:fat, clientesSet:clientesSet, fornClientes:fornClientes, fornValor:fornValor, clientInd:clientInd, cliVenda:cliVenda, fornCliVal:fornCliVal};
}

function mergePositivacao(r, v, s){
  var m = {};
  function get(c){ if(!m[c]) m[c] = {st:{}, inds:{}}; return m[c]; }
  Object.keys((v && v.clientesSet && v.clientesSet[r.cod]) || {}).forEach(function(c){
    var e = get(c); e.st.fat = true;
    if(v.clientInd && v.clientInd[r.cod] && v.clientInd[r.cod][c]) Object.keys(v.clientInd[r.cod][c]).forEach(function(k){ e.inds[k] = true; });
  });
  if(s && s.cliSt) Object.keys(s.cliSt).forEach(function(c){
    var e = get(c);
    Object.keys(s.cliSt[c]).forEach(function(k){ e.st[k] = true; });
    if(s.clientInd && s.clientInd[c]) Object.keys(s.clientInd[c]).forEach(function(k){ e.inds[k] = true; });
  });
  var lista = Object.keys(m);
  r.posit = lista.filter(function(c){ return m[c].st.fat; }).length;
  r.clientesPositivados = lista.map(function(c){
    var val = {};
    if(m[c].st.fat && v && v.cliVenda && v.cliVenda[r.cod] && v.cliVenda[r.cod][c]) val.fat = Math.round(v.cliVenda[r.cod][c]*100)/100;
    if(s && s.cliVal && s.cliVal[c]) Object.keys(s.cliVal[c]).forEach(function(k){ if(s.cliVal[c][k]) val[k] = Math.round(s.cliVal[c][k]*100)/100; });
    return {nome: nomeCliente(c), industrias: Object.keys(m[c].inds), st: Object.keys(m[c].st), val: val};
  }).sort(function(a,b){ return String(a.nome).localeCompare(String(b.nome)); });
}

function fornDaIndustria(cod, nome, fornClientes){
  if(nome === 'Maná') return MANA_NAMES;
  if(IND_MAP[nome]) return [IND_MAP[nome]];
  var k = IND_ALIAS[nome];
  if(!k) return [];
  return Object.keys(fornClientes[cod] || {}).filter(function(f){ return String(f).toUpperCase().indexOf(k) >= 0; });
}
function indDoForn(forn, revMap){
  if(revMap[forn]) return revMap[forn];
  var u = String(forn).toUpperCase();
  for(var n in IND_ALIAS){ if(u.indexOf(IND_ALIAS[n]) >= 0) return n; }
  return null;
}
function clientesDaIndustria(cod, nome, fornClientes, pmin, fornCliVal){
  var set = {};
  fornDaIndustria(cod, nome, fornClientes).forEach(function(fn){
    if(!fornClientes[cod] || !fornClientes[cod][fn]) return;
    Object.keys(fornClientes[cod][fn]).forEach(function(c){
      if(pmin > 0){ var val = fornCliVal && fornCliVal[cod] && fornCliVal[cod][fn] && fornCliVal[cod][fn][c]; if(!(val >= pmin)) return; }
      set[c] = true;
    });
  });
  return Object.keys(set);
}
function realizadoIndustria(cod, nome, tipo, fornClientes, fornValor, pmin, fornCliVal){
  if(tipo === 'qtd') return clientesDaIndustria(cod, nome, fornClientes, pmin, fornCliVal).length;
  var valor = 0;
  fornDaIndustria(cod, nome, fornClientes).forEach(function(fn){ if(fornValor[cod] && fornValor[cod][fn]) valor += fornValor[cod][fn]; });
  return Math.round(valor * 100) / 100;
}

function baixarArquivoAtualizado(doc, filename){
  var blob = new Blob([doc], {type:'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename || 'index.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
